<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nesting V2 - Motor Vector Drop</title>
<style>
  body { margin:0; font-family:monospace; font-size:12px; background:#f0f2f5; overflow-y: auto; padding-bottom: 100px; }
  #controls { display:flex; gap:6px; padding:6px; align-items:center; flex-wrap:wrap; background:#fff; border-bottom:1px solid #ccc; position: sticky; top: 0; z-index: 10; }
  button { padding:5px 12px; cursor:pointer; background:#007bff; color:#fff; border:none; border-radius:3px; }
  button:disabled { background:#aaa; }
  button.success { background:#28a745; }
  canvas { background:#fff; display:block; margin:10px auto; box-shadow:0 0 10px rgba(0,0,0,0.1); }
  #status { padding:10px; text-align:center; font-weight:bold; color:#333; background:#e9ecef; }
  #jsonPanel, #resultPanel { padding:6px; border-bottom:1px solid #ccc; background:#fff; }
  #jsonPanel { display:none; }
  #resultPanel { display:none; margin-top:10px; border-top:2px solid #007bff; }
  #resultPanel textarea { width:100%; box-sizing:border-box; height:120px; font-size:10px; margin-top:5px; }
  .stat-box { font-weight: bold; color: #28a745; }
</style>
</head>
<body>

<div id="controls">
  <button id="btnTogglePanel">Pegar JSON ▾</button>
  <input type="file" id="fileInput" accept=".json">
  <button id="btnNesting" disabled>Ejecutar Nesting</button>
  <label>Ancho: <input type="number" id="inputAncho" value="160" style="width:40px"> cm</label>
  <label>Iteraciones: <input type="number" id="inputIter" value="50" style="width:40px"></label>
</div>

<div id="jsonPanel">
  <textarea id="jsonTxt" placeholder="Pega el JSON aquí..."></textarea>
  <button id="btnCargarTxt" style="margin-top:5px;">Cargar JSON</button>
</div>

<div id="status">Carga un JSON para comenzar.</div>
<canvas id="c"></canvas>

<div id="resultPanel">
  <div id="resultStats">Aprovechamiento: Calculando...</div>
  <div style="margin-top:5px; display:flex; gap:5px;">
    <button id="btnCopiar">Copiar JSON</button>
    <button id="btnDescargar" class="success">Descargar JSON</button>
  </div>
  <textarea id="resultTxt" readonly placeholder="El resultado final aparecerá aquí..."></textarea>
</div>

<script>
// ======================================================================
// 1. MOTOR GEOMÉTRICO Y PARSEO DE CURVAS
// ======================================================================
const lerp = (a,b,t) => a+(b-a)*t;
const ptLerp = (a,b,t) => ({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)});
const ptQuad = (p0,cp,p1,t) => ptLerp(ptLerp(p0,cp,t), ptLerp(cp,p1,t), t);

function construirPoligono(segs) {
  const poly = [];
  const PUNTOS_POR_CURVA = 8; 
  segs.forEach(seg => {
    if (seg.type === 'line') {
      poly.push({ ...seg.pts[0] }); 
    } else {
      for (let i = 0; i < PUNTOS_POR_CURVA; i++) {
        poly.push(ptQuad(seg.pts[0], seg.pts[1], seg.pts[2], i / PUNTOS_POR_CURVA));
      }
    }
  });
  return poly;
}

function polygonArea(poly) {
  let area = 0;
  for (let i = 0; i < poly.length; i++) {
    const j = (i + 1) % poly.length;
    area += poly[i].x * poly[j].y;
    area -= poly[j].x * poly[i].y;
  }
  return Math.abs(area / 2);
}

const Geo = {
  bbox(poly) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of poly) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
  },
  translate(poly, dx, dy) { return poly.map(p => ({ x: p.x + dx, y: p.y + dy })); },
  rotate180(poly) {
    const bb = this.bbox(poly);
    return poly.map(p => ({ x: bb.w - (p.x - bb.minX), y: bb.h - (p.y - bb.minY) }));
  },
  pointInPoly(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const intersect = ((poly[i].y > pt.y) !== (poly[j].y > pt.y)) &&
        (pt.x < (poly[j].x - poly[i].x) * (pt.y - poly[i].y) / (poly[j].y - poly[i].y) + poly[i].x);
      if (intersect) inside = !inside;
    }
    return inside;
  },
  segmentsIntersect(p1, p2, p3, p4) {
    const d1 = (p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x);
    const d2 = (p4.x - p3.x) * (p2.y - p3.y) - (p4.y - p3.y) * (p2.x - p3.x);
    const d3 = (p2.x - p1.x) * (p3.y - p1.y) - (p2.y - p1.y) * (p3.x - p1.x);
    const d4 = (p2.x - p1.x) * (p4.y - p1.y) - (p2.y - p1.y) * (p4.x - p1.x);
    return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
  },
  collide(polyA, polyB) {
    const bbA = this.bbox(polyA); const bbB = this.bbox(polyB);
    if (bbA.maxX < bbB.minX || bbA.minX > bbB.maxX || bbA.maxY < bbB.minY || bbA.minY > bbB.maxY) return false;
    for (let i = 0; i < polyA.length; i++) {
      const a1 = polyA[i], a2 = polyA[(i + 1) % polyA.length];
      for (let j = 0; j < polyB.length; j++) {
        const b1 = polyB[j], b2 = polyB[(j + 1) % polyB.length];
        if (this.segmentsIntersect(a1, a2, b1, b2)) return true;
      }
    }
    if (this.pointInPoly(polyA[0], polyB)) return true;
    if (this.pointInPoly(polyB[0], polyA)) return true;
    return false;
  }
};

// ======================================================================
// 2. LÓGICA DE LA INTERFAZ Y EL WEB WORKER
// ======================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let piezas = [];
let TELA_W = 160;

const workerCode = `
  const Geo = {
    bbox(poly) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of poly) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
      return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
    },
    translate(poly, dx, dy) { return poly.map(p => ({ x: p.x + dx, y: p.y + dy })); },
    rotate180(poly) {
      const bb = this.bbox(poly);
      return poly.map(p => ({ x: bb.w - (p.x - bb.minX), y: bb.h - (p.y - bb.minY) }));
    },
    pointInPoly(pt, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const intersect = ((poly[i].y > pt.y) !== (poly[j].y > pt.y)) &&
          (pt.x < (poly[j].x - poly[i].x) * (pt.y - poly[i].y) / (poly[j].y - poly[i].y) + poly[i].x);
        if (intersect) inside = !inside;
      }
      return inside;
    },
    segmentsIntersect(p1, p2, p3, p4) {
      const d1 = (p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x);
      const d2 = (p4.x - p3.x) * (p2.y - p3.y) - (p4.y - p3.y) * (p2.x - p3.x);
      const d3 = (p2.x - p1.x) * (p3.y - p1.y) - (p2.y - p1.y) * (p3.x - p1.x);
      const d4 = (p2.x - p1.x) * (p4.y - p1.y) - (p2.y - p1.y) * (p4.x - p1.x);
      return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
    },
    collide(polyA, polyB) {
      const bbA = this.bbox(polyA); const bbB = this.bbox(polyB);
      if (bbA.maxX < bbB.minX || bbA.minX > bbB.maxX || bbA.maxY < bbB.minY || bbA.minY > bbB.maxY) return false;
      for (let i = 0; i < polyA.length; i++) {
        const a1 = polyA[i], a2 = polyA[(i + 1) % polyA.length];
        for (let j = 0; j < polyB.length; j++) {
          const b1 = polyB[j], b2 = polyB[(j + 1) % polyB.length];
          if (this.segmentsIntersect(a1, a2, b1, b2)) return true;
        }
      }
      if (this.pointInPoly(polyA[0], polyB)) return true;
      if (this.pointInPoly(polyB[0], polyA)) return true;
      return false;
    }
  };

  // NUEVA FUNCIÓN: Hacer caer la pieza hasta que choque
  function getDropY(poly, x, colocadas, maxAltura) {
    const margen = 0.5;
    let y = maxAltura + 20; // Empezar arriba del todo
    let step = 1.0; // Caer de 1cm en 1cm
    let lastValid = y;
    
    while (y >= 0) {
      const testPoly = Geo.translate(poly, x + margen, y + margen);
      let choca = false;
      
      // ¿Choca con alguna pieza ya colocada?
      for (const col of colocadas) {
        if (Geo.collide(testPoly, col.poly)) { choca = true; break; }
      }
      
      if (choca) {
        return lastValid; // Chocó, devolver la última posición válida
      }
      lastValid = y;
      y -= step; // Bajar 1cm más
    }
    return 0; // Llegó al piso
  }

  function calcularLayout(ordenPiezas, telaW) {
    const colocadas = [];
    let maxAltura = 0;
    const margen = 0.5;

    for (let i = 0; i < ordenPiezas.length; i++) {
      const p = ordenPiezas[i];
      let mejorPos = { tx: 0, ty: maxAltura };
      let mejorRot = false;
      let mejorScore = Infinity;

      const polyRot = Geo.rotate180(p.poly);
      const variantes = [
        { poly: p.poly, bb: p.bb, rot: false },
        { poly: polyRot, bb: Geo.bbox(polyRot), rot: true }
      ];

      // Probar ambas rotaciones (0 y 180)
      for (const v of variantes) {
        // Deslizar a lo largo del ancho de la tela de 1cm en 1cm
        for (let x = 0; x <= telaW - v.bb.w; x += 1) {
          // Hacer caer la pieza
          let y = getDropY(v.poly, x, colocadas, maxAltura);
          
          // Score: priorizar que quede más abajo (Y), luego más a la izquierda (X)
          const score = y * telaW + x;
          if (score < mejorScore) {
            mejorScore = score;
            mejorPos = { tx: x, ty: y };
            mejorRot = v.rot;
          }
        }
      }

      // Guardar la pieza en la mejor posición encontrada
      const v = mejorRot ? variantes[1] : variantes[0];
      const polyFinal = Geo.translate(v.poly, mejorPos.tx + margen, mejorPos.ty + margen);
      colocadas.push({ id: p.id, poly: polyFinal, tx: mejorPos.tx, ty: mejorPos.ty, bb: v.bb, rotada: mejorRot });
      
      if (mejorPos.ty + v.bb.h > maxAltura) {
        maxAltura = mejorPos.ty + v.bb.h;
      }
    }
    return { layout: colocadas.map(c => ({ id: c.id, tx: c.tx, ty: c.ty, rotada: c.rotada })), altura: maxAltura };
  }

  self.onmessage = function(e) {
    if (e.data.cmd === 'start') {
      const piezas = e.data.piezas;
      const telaW = e.data.telaW;
      const iteraciones = e.data.iteraciones;
      let lastUpdate = 0;
      
      self.postMessage({ cmd: 'progress', msg: 'Iniciando caída de piezas...' });

      let mejorOrden = [...piezas].sort((a, b) => (b.bb.w * b.bb.h) - (a.bb.w * a.bb.h));
      let mejorResultado = calcularLayout(mejorOrden, telaW);
      
      self.postMessage({ cmd: 'update', layout: mejorResultado.layout, altura: mejorResultado.altura });

      for (let i = 0; i < iteraciones; i++) {
        let nuevoOrden = [...mejorOrden];
        const idx1 = Math.floor(Math.random() * nuevoOrden.length);
        const idx2 = Math.floor(Math.random() * nuevoOrden.length);
        [nuevoOrden[idx1], nuevoOrden[idx2]] = [nuevoOrden[idx2], nuevoOrden[idx1]];
        
        let nuevoResultado = calcularLayout(nuevoOrden, telaW);
        
        if (nuevoResultado.altura < mejorResultado.altura) {
          mejorResultado = nuevoResultado;
          mejorOrden = nuevoOrden;
          
          const now = Date.now();
          if (now - lastUpdate > 100) {
            self.postMessage({ cmd: 'update', layout: mejorResultado.layout, altura: mejorResultado.altura });
            lastUpdate = now;
          }
        }
        
        if (i % 5 === 0) {
          self.postMessage({ cmd: 'progress', msg: 'Probando combinación ' + (i+1) + '/' + iteraciones + ' | Altura: ' + mejorResultado.altura.toFixed(2) + 'cm' });
        }
      }
      self.postMessage({ cmd: 'done', layout: mejorResultado.layout, altura: mejorResultado.altura });
    }
  };
`;

const blob = new Blob([workerCode], { type: 'application/javascript' });
const worker = new Worker(URL.createObjectURL(blob));

worker.onmessage = function(e) {
  if (e.data.cmd === 'progress') {
    document.getElementById('status').textContent = e.data.msg;
  } else if (e.data.cmd === 'update') {
    document.getElementById('status').textContent = '¡Mejor acomodo encontrado! Altura: ' + e.data.altura.toFixed(2) + 'cm';
    dibujarLayout(e.data.layout);
  } else if (e.data.cmd === 'done') {
    document.getElementById('status').textContent = 'Nesting completado. Altura final: ' + e.data.altura.toFixed(2) + 'cm';
    procesarResultado(e.data.layout, e.data.altura);
    const btn = document.getElementById('btnNesting');
    btn.disabled = false;
    btn.textContent = 'Ejecutar Nesting';
  }
};

// ======================================================================
// 3. PARSEO, DIBUJO Y EXPORTACIÓN
// ======================================================================
function cargarJSON(texto) {
  const data = JSON.parse(texto);
  const pxPerCm = data.pxPerCm || 37.79527559055118;
  const figs = data.figures.filter(f => f.closed !== false && f.vertices && f.vertices.length >= 3);
  
  piezas = figs.map((fig, idx) => {
    const verts = fig.vertices.map(v => ({
      x: v.xCm !== undefined ? v.xCm : v.x / pxPerCm,
      y: v.yCm !== undefined ? v.yCm : v.y / pxPerCm
    }));
    const n = verts.length, edgeMap = {};
    fig.edges.forEach(e => { edgeMap[e.start + '_' + e.end] = e; });
    const segs = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, e = edgeMap[i + '_' + j];
      if (!e) segs.push({type:'line', pts:[{...verts[i]}, {...verts[j]}]});
      else if (!e.curved) segs.push({type:'line', pts:[{...verts[e.start]}, {...verts[e.end]}]});
      else segs.push({type:'quad', pts:[{...verts[e.start]}, {x:e.controlX/pxPerCm, y:e.controlY/pxPerCm}, {...verts[e.end]}]});
    }
    
    const poly = construirPoligono(segs);
    const minX = Math.min(...poly.map(p => p.x));
    const minY = Math.min(...poly.map(p => p.y));
    const polyN = poly.map(p => ({ x: p.x - minX, y: p.y - minY }));
    const bb = Geo.bbox(polyN);
    const area = polygonArea(polyN);
    return { id: idx, poly: polyN, bb, area };
  });
  
  document.getElementById('status').textContent = piezas.length + ' piezas cargadas. Listo para nesting.';
  document.getElementById('btnNesting').disabled = false;
  TELA_W = parseFloat(document.getElementById('inputAncho').value) || 160;
  dibujarVistaPrevia();
}

function dibujarVistaPrevia() {
  const PX = 4;
  canvas.width = TELA_W * PX;
  canvas.height = 600;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  let currentX = 0;
  let currentY = 0;
  let rowMaxH = 0;
  
  piezas.forEach(p => {
    if (currentX + p.bb.w > TELA_W) {
      currentX = 0;
      currentY += rowMaxH + 2;
      rowMaxH = 0;
    }
    let poly = Geo.translate(p.poly, currentX, currentY);
    ctx.beginPath();
    ctx.moveTo(poly[0].x * PX, poly[0].y * PX);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x * PX, poly[i].y * PX);
    ctx.closePath();
    ctx.fillStyle = '#e4e4e4';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
    currentX += p.bb.w + 2;
    if (p.bb.h > rowMaxH) rowMaxH = p.bb.h;
  });
  
  document.getElementById('resultPanel').style.display = 'none';
}

function dibujarLayout(layout) {
  const PX = 4;
  let maxY = 0;
  
  layout.forEach(item => {
    const p = piezas.find(pz => pz.id === item.id);
    if (p) {
      const h = item.ty + p.bb.h;
      if (h > maxY) maxY = h;
    }
  });
  
  canvas.width = TELA_W * PX;
  canvas.height = (maxY + 5) * PX;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  layout.forEach(item => {
    const pieza = piezas.find(p => p.id === item.id);
    if (!pieza) return;
    let poly = pieza.poly;
    if (item.rotada) poly = Geo.rotate180(poly);
    poly = Geo.translate(poly, item.tx, item.ty);
    
    ctx.beginPath();
    ctx.moveTo(poly[0].x * PX, poly[0].y * PX);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x * PX, poly[i].y * PX);
    ctx.closePath();
    ctx.fillStyle = item.rotada ? '#cce5ff' : '#e4e4e4';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function procesarResultado(layout, maxY) {
  let areaTotalPiezas = 0;
  layout.forEach(item => {
    const p = piezas.find(pz => pz.id === item.id);
    if (p) areaTotalPiezas += p.area;
  });
  
  const areaTelaUsada = TELA_W * maxY;
  const aprovechamiento = areaTelaUsada > 0 ? (areaTotalPiezas / areaTelaUsada) * 100 : 0;
  
  const resultPanel = document.getElementById('resultPanel');
  const resultStats = document.getElementById('resultStats');
  const resultTxt = document.getElementById('resultTxt');
  
  resultStats.innerHTML = `Aprovechamiento: <span class="stat-box">${aprovechamiento.toFixed(2)}%</span> | Altura usada: ${maxY.toFixed(2)} cm`;
  resultTxt.value = JSON.stringify(layout, null, 2);
  resultPanel.style.display = 'block';
}

// ======================================================================
// 4. EVENTOS
// ======================================================================
document.getElementById('btnTogglePanel').addEventListener('click', () => {
  const p = document.getElementById('jsonPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('btnCargarTxt').addEventListener('click', () => {
  const txt = document.getElementById('jsonTxt').value.trim();
  if (!txt) { alert('Pega el JSON primero.'); return; }
  try { cargarJSON(txt); } catch(e) { alert('Error: ' + e.message); }
});

document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => cargarJSON(ev.target.result);
  r.readAsText(f);
});

document.getElementById('btnNesting').addEventListener('click', () => {
  if (!piezas.length) return;
  const btn = document.getElementById('btnNesting');
  btn.disabled = true;
  btn.textContent = 'Ejecutando...';
  TELA_W = parseFloat(document.getElementById('inputAncho').value) || 160;
  const iteraciones = parseInt(document.getElementById('inputIter').value) || 50;
  worker.postMessage({ cmd: 'start', piezas: piezas, telaW: TELA_W, iteraciones: iteraciones });
});

document.getElementById('btnCopiar').addEventListener('click', () => {
  const txt = document.getElementById('resultTxt');
  txt.select();
  txt.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(txt.value).then(() => {
    alert('JSON copiado al portapapeles!');
  }).catch(err => {
    alert('Error al copiar: ' + err);
  });
});

document.getElementById('btnDescargar').addEventListener('click', () => {
  const txt = document.getElementById('resultTxt').value;
  const blob = new Blob([txt], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'resultado_nesting.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
