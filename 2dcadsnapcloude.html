<!DOCTYPE html>  
<html lang="es">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>  
  <title>2d cad cloth</title>
  <style>
    body { margin: 0; padding: 8px; overflow: auto; background-color: rgb(197, 197, 197); }
    #canvas { border: 1px solid black; display: block; }
    button.on { background: #94c495; color: rgb(0, 0, 0); font-weight: bold; }
    #joinApplyBtn { display: none; margin-left: 6px; }
  </style>
</head>  
<body>  
  <div>

    <div>
      <button id="createBtn" onclick="toggleCreate()">Crear OFF</button>
      <input type="number" id="sidesInput" min="3" max="10" value="3">
      <span>lados</span>
    </div>

    <div>
      <button id="moveBtn" onclick="toggleMove()">Mover OFF</button>
      <button id="vertexBtn" onclick="toggleVertex()">Vértice OFF</button>
      <button id="snapBtn" onclick="toggleSnap()">Snap OFF</button>
      <button id="addVertexBtn" onclick="toggleAddVertex()">Agregar Vértice OFF</button>
      <button id="curveBtn" onclick="toggleCurve()">Curvar OFF</button>
      <button id="straightenBtn" onclick="toggleStraighten()">Curva→Recta OFF</button>
      <button id="mirrorBtn" onclick="toggleMirror()">Desdoblar OFF</button>
    </div>

    <div>
      <button id="joinCurvesBtn" onclick="toggleJoinCurves()">Unir Curvas OFF</button>
      <button id="joinApplyBtn" onclick="applyJoinCurves()">Aplicar Unión</button>
    </div>

    <div id="vertexInputs" hidden>
      <span>X:</span><input type="number" id="vertexX">
      <span>Y:</span><input type="number" id="vertexY">
      <button onclick="applyVertexCoordinates()">Aplicar</button>
    </div>

    <div>
      <button id="resizeBtn" onclick="toggleResize()">Cambiar Medida OFF</button>
    </div>
    <div id="resizeInputs" hidden>
      <span>Nueva medida (px):</span>
      <input type="number" id="resizeValue" min="1">
      <button onclick="applyResize()">Aplicar</button>
      <span id="resizeIndicator" style="font-style:italic; color:#c0392b;"></span>
    </div>

    <div>
      <button id="rotateBtn" onclick="toggleRotate()">Rotar OFF</button>
      <input type="number" id="rotateInput" value="90" step="1">
      <span>grados</span>
    </div>

    <div>
      <button id="duplicateBtn" onclick="toggleDuplicate()">Duplicar OFF</button>
      <button id="reflectBtn" onclick="toggleReflect()">Reflejar OFF</button>
    </div>

    <div>
      <button id="deleteBtn" onclick="toggleDelete()">Eliminar OFF</button>
      <button onclick="clearAll()">Eliminar Todo</button>
      <button onclick="undoAction()">Deshacer</button>
      <button onclick="exportJSON()">Exportar JSON</button>
      <button onclick="importJSON()">Importar JSON</button>
    </div>

  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let figures = [];
    let figuresHistory = [];
    let mode = 'none';
    let dragData = null;
    let selectedVertex = null;
    let selectedEdge = null;
    let touchStartPositions = [];
    let isTouchDevice = false;

    let snapEnabled = false;
    const SNAP_THRESHOLD = 10;

    let joinSelection = [];

    // ---- Canvas resize ----
    function resizeCanvas() {
      canvas.width = Math.max(1200, window.innerWidth - 16);
      canvas.height = Math.max(1200, window.innerHeight - 220);
      redrawAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ---- History ----
    function saveState() {
      figuresHistory.push(JSON.parse(JSON.stringify(figures)));
      if (figuresHistory.length > 20) figuresHistory.shift();
    }
    function undoAction() {
      if (figuresHistory.length > 0) { figures = figuresHistory.pop(); redrawAll(); }
      else alert('No hay acciones para deshacer');
    }
    function clearAll() {
      if (confirm('¿Eliminar todas las figuras?')) { saveState(); figures = []; redrawAll(); }
    }

    // ---- Mode toggles ----
    function toggleCreate()     { setMode('create',     'Crear'); }
    function toggleMove()       { setMode('move',       'Mover'); }
    function toggleCurve()      { setMode('curve',      'Curvar'); }
    function toggleStraighten() { setMode('straighten', 'Curva→Recta'); }
    function toggleDelete()     { setMode('delete',     'Eliminar'); }
    function toggleMirror()     { setMode('mirror',     'Desdoblar'); }
    function toggleAddVertex()  { setMode('addVertex',  'Agregar Vértice'); }
    function toggleResize()     { setMode('resize',     'Cambiar Medida'); }
    function toggleRotate()     { setMode('rotate',     'Rotar'); }
    function toggleDuplicate()  { setMode('duplicate',  'Duplicar'); }
    function toggleReflect()    { setMode('reflect',    'Reflejar'); }

    function toggleVertex() {
      const btn = document.getElementById('vertexBtn');
      const inputs = document.getElementById('vertexInputs');
      if (mode === 'vertex') {
        mode = 'none'; btn.textContent = 'Vértice OFF'; btn.classList.remove('on');
        inputs.hidden = true; selectedVertex = null;
      } else {
        mode = 'vertex'; btn.textContent = 'Vértice ON'; btn.classList.add('on');
        inputs.hidden = false;
        resetOtherButtons('vertexBtn');
      }
    }

    // Snap: al activar, también activa modo Vértice automáticamente
    function toggleSnap() {
      snapEnabled = !snapEnabled;
      const btn = document.getElementById('snapBtn');
      btn.textContent = snapEnabled ? 'Snap ON' : 'Snap OFF';
      btn.classList.toggle('on', snapEnabled);

      if (snapEnabled && mode !== 'vertex') {
        // Activar modo vértice
        mode = 'vertex';
        const vBtn = document.getElementById('vertexBtn');
        vBtn.textContent = 'Vértice ON';
        vBtn.classList.add('on');
        document.getElementById('vertexInputs').hidden = false;
        resetOtherButtons('vertexBtn');
      }
    }

    function toggleJoinCurves() {
      const btn = document.getElementById('joinCurvesBtn');
      const applyBtn = document.getElementById('joinApplyBtn');
      if (mode === 'joinCurves') {
        mode = 'none'; btn.textContent = 'Unir Curvas OFF'; btn.classList.remove('on');
        applyBtn.style.display = 'none';
        joinSelection = [];
        redrawAll();
      } else {
        mode = 'joinCurves'; btn.textContent = 'Unir Curvas ON'; btn.classList.add('on');
        applyBtn.style.display = 'inline-block';
        joinSelection = [];
        resetOtherButtons('joinCurvesBtn');
        redrawAll();
      }
    }

    function setMode(newMode, label) {
      const btn = document.getElementById(newMode + 'Btn');
      if (mode === newMode) {
        mode = 'none'; btn.textContent = label + ' OFF'; btn.classList.remove('on');
        if (newMode === 'resize') {
          document.getElementById('resizeInputs').hidden = true;
          document.getElementById('resizeIndicator').textContent = '';
          selectedEdge = null;
        }
      } else {
        mode = newMode; btn.textContent = label + ' ON'; btn.classList.add('on');
        if (newMode === 'resize') document.getElementById('resizeInputs').hidden = false;
        resetOtherButtons(newMode + 'Btn');
      }
    }

    function resetOtherButtons(activeBtn) {
      const defs = [
        { id:'createBtn',     label:'Crear OFF' },
        { id:'moveBtn',       label:'Mover OFF' },
        { id:'vertexBtn',     label:'Vértice OFF', extra: () => { document.getElementById('vertexInputs').hidden = true; selectedVertex = null; } },
        { id:'addVertexBtn',  label:'Agregar Vértice OFF' },
        { id:'curveBtn',      label:'Curvar OFF' },
        { id:'straightenBtn', label:'Curva→Recta OFF' },
        { id:'deleteBtn',     label:'Eliminar OFF' },
        { id:'mirrorBtn',     label:'Desdoblar OFF' },
        { id:'resizeBtn',     label:'Cambiar Medida OFF', extra: () => {
            document.getElementById('resizeInputs').hidden = true;
            document.getElementById('resizeIndicator').textContent = '';
            selectedEdge = null;
          }
        },
        { id:'rotateBtn',     label:'Rotar OFF' },
        { id:'duplicateBtn',  label:'Duplicar OFF' },
        { id:'reflectBtn',    label:'Reflejar OFF' },
        { id:'joinCurvesBtn', label:'Unir Curvas OFF', extra: () => {
            document.getElementById('joinApplyBtn').style.display = 'none';
            joinSelection = [];
          }
        },
      ];
      defs.forEach(d => {
        if (d.id !== activeBtn) {
          const b = document.getElementById(d.id);
          b.textContent = d.label;
          b.classList.remove('on');
          if (d.extra) d.extra();
        }
      });
      // NOTE: snapBtn is intentionally NOT in this list — it stays independent
    }

    // ---- Snap ----
    function applySnap(x, y, excludeFi, excludeVi) {
      let sx = x, sy = y, foundX = false, foundY = false;
      for (let fi = 0; fi < figures.length && !(foundX && foundY); fi++) {
        for (let vi = 0; vi < figures[fi].vertices.length && !(foundX && foundY); vi++) {
          if (fi === excludeFi && vi === excludeVi) continue;
          const v = figures[fi].vertices[vi];
          if (!foundY && Math.abs(y - v.y) < SNAP_THRESHOLD) { sy = v.y; foundY = true; }
          if (!foundX && Math.abs(x - v.x) < SNAP_THRESHOLD) { sx = v.x; foundX = true; }
        }
      }
      return { x: sx, y: sy };
    }

    function drawSnapGuides(x, y, excludeFi, excludeVi) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,120,255,0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      for (let fi = 0; fi < figures.length; fi++) {
        for (let vi = 0; vi < figures[fi].vertices.length; vi++) {
          if (fi === excludeFi && vi === excludeVi) continue;
          const v = figures[fi].vertices[vi];
          if (Math.abs(y - v.y) < SNAP_THRESHOLD) {
            ctx.beginPath(); ctx.moveTo(0, v.y); ctx.lineTo(canvas.width, v.y); ctx.stroke();
          }
          if (Math.abs(x - v.x) < SNAP_THRESHOLD) {
            ctx.beginPath(); ctx.moveTo(v.x, 0); ctx.lineTo(v.x, canvas.height); ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    // ---- Geometry helpers ----
    function createPolygon(cx, cy, sides, radius = 50) {
      const vertices = [], edges = [];
      for (let i = 0; i < sides; i++) {
        const ang = (i * 2 * Math.PI) / sides - Math.PI / 2;
        vertices.push({ x: cx + radius * Math.cos(ang), y: cy + radius * Math.sin(ang) });
      }
      for (let i = 0; i < sides; i++)
        edges.push({ start: i, end: (i + 1) % sides, curved: false, controlX: null, controlY: null });
      return { vertices, edges };
    }

    function getEventPos(e) {
      const r = canvas.getBoundingClientRect();
      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
      return { x: clientX - r.left, y: clientY - r.top };
    }

    function isPointInPolygon(x, y, figure) {
      const v = figure.vertices; let inside = false;
      for (let i = 0, j = v.length - 1; i < v.length; j = i++)
        if (((v[i].y > y) !== (v[j].y > y)) && (x < (v[j].x - v[i].x) * (y - v[i].y) / (v[j].y - v[i].y) + v[i].x))
          inside = !inside;
      return inside;
    }

    function findClickedFigure(x, y) {
      for (let i = figures.length - 1; i >= 0; i--)
        if (isPointInPolygon(x, y, figures[i])) return i;
      return -1;
    }

    function findNearestVertex(x, y, thr = 20) {
      for (let fi = 0; fi < figures.length; fi++)
        for (let vi = 0; vi < figures[fi].vertices.length; vi++) {
          const p = figures[fi].vertices[vi];
          if (Math.hypot(x - p.x, y - p.y) < thr) return { figureIndex: fi, vertexIndex: vi };
        }
      return null;
    }

    function distanceToLine(px, py, x1, y1, x2, y2) {
      const A = px-x1, B = py-y1, C = x2-x1, D = y2-y1;
      const dot = A*C+B*D, len = C*C+D*D;
      if (!len) return Math.hypot(A, B);
      let t = dot/len;
      if (t < 0) return Math.hypot(A, B);
      if (t > 1) return Math.hypot(px-x2, py-y2);
      return Math.hypot(px-(x1+t*C), py-(y1+t*D));
    }

    function distanceToCurve(px, py, x1, y1, cx, cy, x2, y2) {
      let d = Infinity;
      for (let t = 0; t <= 1; t += 0.05) {
        const xt = (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2;
        const yt = (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2;
        d = Math.min(d, Math.hypot(px-xt, py-yt));
      }
      return d;
    }

    function findNearestEdge(x, y, thr = 15) {
      for (let fi = 0; fi < figures.length; fi++) {
        const f = figures[fi];
        for (let ei = 0; ei < f.edges.length; ei++) {
          const e = f.edges[ei];
          const a = f.vertices[e.start], b = f.vertices[e.end];
          const d = (e.curved && e.controlX != null)
            ? distanceToCurve(x, y, a.x, a.y, e.controlX, e.controlY, b.x, b.y)
            : distanceToLine(x, y, a.x, a.y, b.x, b.y);
          if (d < thr) return { figureIndex: fi, edgeIndex: ei };
        }
      }
      return null;
    }

    function getClosestPointOnLine(px, py, x1, y1, x2, y2) {
      const A = px-x1, B = py-y1, C = x2-x1, D = y2-y1;
      const dot = A*C+B*D, len = C*C+D*D;
      if (!len) return { x: x1, y: y1, t: 0 };
      let t = Math.max(0, Math.min(1, dot/len));
      return { x: x1+t*C, y: y1+t*D, t };
    }

    function getClosestPointOnCurve(px, py, x1, y1, cx, cy, x2, y2) {
      let best = Infinity, bestPt = { x: x1, y: y1, t: 0 };
      for (let t = 0; t <= 1; t += 0.01) {
        const xt = (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2;
        const yt = (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2;
        const d = Math.hypot(px-xt, py-yt);
        if (d < best) { best = d; bestPt = { x: xt, y: yt, t }; }
      }
      return bestPt;
    }

    function getCentroid(figure) {
      let cx = 0, cy = 0;
      figure.vertices.forEach(v => { cx += v.x; cy += v.y; });
      return { x: cx / figure.vertices.length, y: cy / figure.vertices.length };
    }

    // ---- Add vertex on edge ----
    function addVertexOnEdge(figureIndex, edgeIndex, x, y) {
      const figure = figures[figureIndex];
      const edge = figure.edges[edgeIndex];
      const a = figure.vertices[edge.start], b = figure.vertices[edge.end];
      let newPoint, t;
      if (edge.curved && edge.controlX != null) {
        const c = getClosestPointOnCurve(x, y, a.x, a.y, edge.controlX, edge.controlY, b.x, b.y);
        newPoint = { x: c.x, y: c.y }; t = c.t;
      } else {
        const c = getClosestPointOnLine(x, y, a.x, a.y, b.x, b.y);
        newPoint = { x: c.x, y: c.y }; t = c.t;
      }
      const nvi = edge.end;
      figure.vertices.splice(nvi, 0, newPoint);
      figure.edges.forEach(e => { if (e.start >= nvi) e.start++; if (e.end >= nvi) e.end++; });
      if (edge.curved && edge.controlX != null) {
        const c1x = (1-t)*a.x + t*edge.controlX, c1y = (1-t)*a.y + t*edge.controlY;
        const c2x = (1-t)*edge.controlX + t*b.x,   c2y = (1-t)*edge.controlY + t*b.y;
        edge.end = nvi; edge.controlX = c1x; edge.controlY = c1y;
        figure.edges.splice(edgeIndex+1, 0, { start: nvi, end: nvi+1, curved: true, controlX: c2x, controlY: c2y });
      } else {
        edge.end = nvi;
        figure.edges.splice(edgeIndex+1, 0, { start: nvi, end: nvi+1, curved: false, controlX: null, controlY: null });
      }
    }

    // ---- Resize edge ----
    function resizeEdge(figureIndex, edgeIndex, newLength, clickX, clickY) {
      const figure = figures[figureIndex];
      const edge = figure.edges[edgeIndex];
      const a = figure.vertices[edge.start], b = figure.vertices[edge.end];
      const currentLength = Math.hypot(b.x-a.x, b.y-a.y);
      if (currentLength === 0) return;
      const distToA = Math.hypot(clickX-a.x, clickY-a.y);
      const distToB = Math.hypot(clickX-b.x, clickY-b.y);
      const moveB = distToB < distToA;
      const sf = newLength / currentLength;
      if (moveB) {
        const dx = b.x-a.x, dy = b.y-a.y;
        b.x = a.x + dx*sf; b.y = a.y + dy*sf;
        if (edge.curved && edge.controlX != null) {
          edge.controlX = a.x + (edge.controlX-a.x)*sf;
          edge.controlY = a.y + (edge.controlY-a.y)*sf;
        }
      } else {
        const dx = a.x-b.x, dy = a.y-b.y;
        a.x = b.x + dx*sf; a.y = b.y + dy*sf;
        if (edge.curved && edge.controlX != null) {
          edge.controlX = b.x + (edge.controlX-b.x)*sf;
          edge.controlY = b.y + (edge.controlY-b.y)*sf;
        }
      }
    }

    // ---- Rotate / Duplicate / Reflect ----
    function rotateFigure(fi, degrees) {
      const f = figures[fi], c = getCentroid(f);
      const rad = degrees*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
      f.vertices.forEach(v => {
        const dx = v.x-c.x, dy = v.y-c.y;
        v.x = c.x + dx*cos - dy*sin; v.y = c.y + dx*sin + dy*cos;
      });
      f.edges.forEach(e => {
        if (e.curved && e.controlX != null) {
          const dx = e.controlX-c.x, dy = e.controlY-c.y;
          e.controlX = c.x + dx*cos - dy*sin; e.controlY = c.y + dx*sin + dy*cos;
        }
      });
    }

    function duplicateFigure(fi, ox=100, oy=100) {
      const o = figures[fi];
      figures.push({
        vertices: o.vertices.map(v => ({ x: v.x+ox, y: v.y+oy })),
        edges: o.edges.map(e => ({ start:e.start, end:e.end, curved:e.curved,
          controlX: e.curved && e.controlX!=null ? e.controlX+ox : null,
          controlY: e.curved && e.controlY!=null ? e.controlY+oy : null }))
      });
    }

    function reflectFigure(fi, ox=100, oy=0) {
      const o = figures[fi], c = getCentroid(o);
      figures.push({
        vertices: o.vertices.map(v => ({ x: 2*c.x-v.x+ox, y: v.y+oy })),
        edges: o.edges.map(e => ({ start:e.start, end:e.end, curved:e.curved,
          controlX: e.curved && e.controlX!=null ? 2*c.x-e.controlX+ox : null,
          controlY: e.curved && e.controlY!=null ? e.controlY+oy : null }))
      });
    }

    // ---- Unfold ----
    function unfoldFigureInPlace(figure, hingeEdgeIndex) {
      const n = figure.vertices.length;
      if (n < 3) return;
      const hinge = figure.edges[hingeEdgeIndex];
      const A = hinge.start, B = hinge.end;
      const prev = i => (i-1+n)%n, next = i => (i+1)%n;
      const seqOrig = [A]; let i = A;
      while (i !== B) { i = prev(i); seqOrig.push(i); }
      const seqMirror = []; let j = next(B);
      while (j !== A) { seqMirror.push(j); j = next(j); }
      const P1 = figure.vertices[A], P2 = figure.vertices[B];
      function reflectXY(x, y) {
        const dx = P2.x-P1.x, dy = P2.y-P1.y;
        const a = dy, b = -dx, c = dx*P1.y - dy*P1.x;
        const d = (a*x+b*y+c)/(a*a+b*b);
        return { x: x-2*a*d, y: y-2*b*d };
      }
      const nv = [];
      seqOrig.forEach(idx => { const v = figure.vertices[idx]; nv.push({x:v.x,y:v.y}); });
      seqMirror.forEach(idx => { const v = figure.vertices[idx]; nv.push(reflectXY(v.x,v.y)); });
      const ne = [];
      for (let t = 0; t < seqOrig.length-1; t++) {
        const e = figure.edges[seqOrig[t+1]];
        ne.push({ start:t, end:t+1, curved:!!e.curved, controlX:e.curved?e.controlX:null, controlY:e.curved?e.controlY:null });
      }
      for (let t = 0; t < seqMirror.length; t++) {
        const e = figure.edges[(B+t)%n];
        const si = (seqOrig.length-1)+t;
        ne.push({ start:si, end:si+1, curved:!!e.curved,
          controlX: e.curved ? reflectXY(e.controlX,e.controlY).x : null,
          controlY: e.curved ? reflectXY(e.controlX,e.controlY).y : null });
      }
      const eClose = figure.edges[(A-1+n)%n];
      ne.push({ start:nv.length-1, end:0, curved:!!eClose.curved,
        controlX: eClose.curved ? reflectXY(eClose.controlX,eClose.controlY).x : null,
        controlY: eClose.curved ? reflectXY(eClose.controlX,eClose.controlY).y : null });
      figure.vertices = nv; figure.edges = ne;
    }

    // ---- Join curves ----
    function applyJoinCurves() {
      if (joinSelection.length < 2) { alert('Selecciona al menos 2 curvas'); return; }

      const byFigure = {};
      joinSelection.forEach(s => {
        if (!byFigure[s.figureIndex]) byFigure[s.figureIndex] = [];
        byFigure[s.figureIndex].push(s.edgeIndex);
      });

      saveState();

      Object.keys(byFigure).forEach(fiStr => {
        const fi = parseInt(fiStr);
        const figure = figures[fi];
        const edgeIndices = byFigure[fi].sort((a,b) => a-b);

        for (let k = 1; k < edgeIndices.length; k++) {
          if (edgeIndices[k] !== edgeIndices[k-1]+1) {
            alert('Las curvas deben ser consecutivas en la figura ' + fi);
            return;
          }
        }

        const firstEdge = figure.edges[edgeIndices[0]];
        const lastEdge  = figure.edges[edgeIndices[edgeIndices.length-1]];
        const endVIdx   = lastEdge.end;

        // Average control points
        let avgCX = 0, avgCY = 0, count = 0;
        edgeIndices.forEach(ei => {
          const e = figure.edges[ei];
          if (e.curved && e.controlX != null) {
            avgCX += e.controlX; avgCY += e.controlY; count++;
          } else {
            const a = figure.vertices[e.start], b = figure.vertices[e.end];
            avgCX += (a.x+b.x)/2; avgCY += (a.y+b.y)/2; count++;
          }
        });
        avgCX /= count; avgCY /= count;

        // Intermediate vertices to remove
        const intermediateVerts = [];
        for (let k = 0; k < edgeIndices.length-1; k++) {
          intermediateVerts.push(figure.edges[edgeIndices[k]].end);
        }

        // Merge into first edge
        firstEdge.end      = endVIdx;
        firstEdge.curved   = true;
        firstEdge.controlX = avgCX;
        firstEdge.controlY = avgCY;

        // Remove extra edges (high to low)
        const edgesToRemove = edgeIndices.slice(1);
        for (let k = edgesToRemove.length-1; k >= 0; k--)
          figure.edges.splice(edgesToRemove[k], 1);

        // Remove intermediate vertices (high to low) and fix indices
        intermediateVerts.sort((a,b) => b-a);
        intermediateVerts.forEach(vi => {
          figure.vertices.splice(vi, 1);
          figure.edges.forEach(e => {
            if (e.start > vi) e.start--;
            if (e.end   > vi) e.end--;
          });
        });
      });

      joinSelection = [];
      redrawAll();
    }

    // ---- Draw ----
    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      figures.forEach((fig, fi) => drawFigure(fig, fi));
      if (mode === 'resize' && selectedEdge) drawResizeIndicator();
      if (mode === 'addVertex') drawVertexDots();
    }

    function redrawWithGuides(x, y, figureIndex, vertexIndex) {
      redrawAll();
      if (snapEnabled) drawSnapGuides(x, y, figureIndex, vertexIndex);
    }

    function drawFigure(figure, fi) {
      figure.edges.forEach((e, ei) => {
        const a = figure.vertices[e.start], b = figure.vertices[e.end];
        const isSelected = mode === 'joinCurves' &&
          joinSelection.some(s => s.figureIndex === fi && s.edgeIndex === ei);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        if (e.curved && e.controlX != null) {
          ctx.quadraticCurveTo(e.controlX, e.controlY, b.x, b.y);
        } else {
          ctx.lineTo(b.x, b.y);
        }
        ctx.strokeStyle = isSelected ? '#e74c3c' : '#000';
        ctx.lineWidth   = isSelected ? 3 : 2;
        ctx.stroke();
      });
    }

    function drawVertexDots() {
      figures.forEach(fig => {
        fig.vertices.forEach(v => {
          ctx.beginPath();
          ctx.arc(v.x, v.y, 3, 0, Math.PI*2);
          ctx.fillStyle = '#e74c3c';
          ctx.fill();
        });
      });
    }

    function drawResizeIndicator() {
      if (!selectedEdge) return;
      const fig = figures[selectedEdge.figureIndex];
      const edge = fig.edges[selectedEdge.edgeIndex];
      const a = fig.vertices[edge.start], b = fig.vertices[edge.end];
      const distToA = Math.hypot(selectedEdge.clickX-a.x, selectedEdge.clickY-a.y);
      const distToB = Math.hypot(selectedEdge.clickX-b.x, selectedEdge.clickY-b.y);
      const movingPt = distToB < distToA ? b : a;
      const fixedPt  = distToB < distToA ? a : b;

      ctx.beginPath(); ctx.arc(fixedPt.x, fixedPt.y, 3, 0, Math.PI*2);
      ctx.fillStyle = '#27ae60'; ctx.fill();

      ctx.beginPath(); ctx.arc(movingPt.x, movingPt.y, 3, 0, Math.PI*2);
      ctx.fillStyle = '#e74c3c'; ctx.fill();

      document.getElementById('resizeIndicator').textContent =
        '← se moverá el extremo ' + (distToB < distToA ? 'B' : 'A') + ' (rojo)';
    }

    // ---- Events ----
    canvas.addEventListener('touchstart', e => { isTouchDevice = true; handleTouchStart(e); }, {passive:true});
    canvas.addEventListener('touchmove',  handleTouchMove, {passive:true});
    canvas.addEventListener('touchend',   handleTouchEnd,  {passive:true});
    canvas.addEventListener('touchmove',  e => { if (e.touches.length===1 && dragData) e.preventDefault(); }, {passive:false});

    canvas.addEventListener('mousedown', e => { if (!isTouchDevice) handleStart(e); });
    canvas.addEventListener('mousemove', e => { if (!isTouchDevice) handleMove(e); });
    canvas.addEventListener('mouseup',   e => { if (!isTouchDevice) handleEnd(e); });

    function handleTouchStart(e) {
      if (e.touches.length === 1) handleSingleTouch(getEventPos(e));
      else if (e.touches.length === 2)
        touchStartPositions = Array.from(e.touches).map(t => ({x:t.clientX,y:t.clientY}));
    }
    function handleTouchMove(e) { if (e.touches.length===1 && dragData) handleDragMove(getEventPos(e)); }
    function handleTouchEnd()   { dragData = null; touchStartPositions = []; }
    function handleStart(e)     { if (e.touches) return; e.preventDefault(); handleSingleTouch(getEventPos(e)); }
    function handleMove(e)      { if (e.touches) return; e.preventDefault(); if (dragData) handleDragMove(getEventPos(e)); }
    function handleEnd(e)       { if (e.touches) return; e.preventDefault(); dragData = null; }

    function handleSingleTouch(pos) {
      if (mode==='create') {
        const s = parseInt(document.getElementById('sidesInput').value);
        if (s>=3 && s<=10) { saveState(); figures.push(createPolygon(pos.x,pos.y,s)); redrawAll(); }
      }
      else if (mode==='move') {
        const fi = findClickedFigure(pos.x,pos.y);
        if (fi!==-1) { saveState(); dragData = {type:'figure',figureIndex:fi,startX:pos.x,startY:pos.y}; }
      }
      else if (mode==='vertex') {
        const nv = findNearestVertex(pos.x,pos.y);
        if (nv) {
          saveState();
          selectedVertex = nv;
          const v = figures[nv.figureIndex].vertices[nv.vertexIndex];
          document.getElementById('vertexX').value = Math.round(v.x);
          document.getElementById('vertexY').value = Math.round(v.y);
          dragData = {type:'vertex',figureIndex:nv.figureIndex,vertexIndex:nv.vertexIndex};
        }
      }
      else if (mode==='addVertex') {
        const ne = findNearestEdge(pos.x,pos.y);
        if (ne) { saveState(); addVertexOnEdge(ne.figureIndex,ne.edgeIndex,pos.x,pos.y); redrawAll(); }
      }
      else if (mode==='curve') {
        const ne = findNearestEdge(pos.x,pos.y);
        if (ne) {
          saveState();
          const edge = figures[ne.figureIndex].edges[ne.edgeIndex];
          edge.curved=true; edge.controlX=pos.x; edge.controlY=pos.y;
          dragData = {type:'curve',figureIndex:ne.figureIndex,edgeIndex:ne.edgeIndex};
          redrawAll();
        }
      }
      else if (mode==='straighten') {
        const ne = findNearestEdge(pos.x,pos.y);
        if (ne) {
          const edge = figures[ne.figureIndex].edges[ne.edgeIndex];
          if (edge.curved) {
            saveState();
            edge.curved=false; edge.controlX=null; edge.controlY=null;
            redrawAll();
          }
        }
      }
      else if (mode==='joinCurves') {
        const ne = findNearestEdge(pos.x,pos.y);
        if (ne) {
          const edge = figures[ne.figureIndex].edges[ne.edgeIndex];
          if (!edge.curved) return;
          const idx = joinSelection.findIndex(s => s.figureIndex===ne.figureIndex && s.edgeIndex===ne.edgeIndex);
          if (idx >= 0) joinSelection.splice(idx,1);
          else joinSelection.push({figureIndex:ne.figureIndex, edgeIndex:ne.edgeIndex});
          redrawAll();
        }
      }
      else if (mode==='resize') {
        const ne = findNearestEdge(pos.x,pos.y);
        if (ne) {
          const fig = figures[ne.figureIndex];
          const edge = fig.edges[ne.edgeIndex];
          const a = fig.vertices[edge.start], b = fig.vertices[edge.end];
          selectedEdge = {figureIndex:ne.figureIndex, edgeIndex:ne.edgeIndex, clickX:pos.x, clickY:pos.y};
          document.getElementById('resizeValue').value = Math.round(Math.hypot(b.x-a.x, b.y-a.y));
          redrawAll();
        }
      }
      else if (mode==='rotate') {
        const fi = findClickedFigure(pos.x,pos.y);
        if (fi!==-1) { saveState(); rotateFigure(fi, parseFloat(document.getElementById('rotateInput').value)||90); redrawAll(); }
      }
      else if (mode==='duplicate') {
        const fi = findClickedFigure(pos.x,pos.y);
        if (fi!==-1) { saveState(); duplicateFigure(fi); redrawAll(); }
      }
      else if (mode==='reflect') {
        const fi = findClickedFigure(pos.x,pos.y);
        if (fi!==-1) { saveState(); reflectFigure(fi); redrawAll(); }
      }
      else if (mode==='delete') {
        const fi = findClickedFigure(pos.x,pos.y);
        if (fi!==-1) { saveState(); figures.splice(fi,1); redrawAll(); }
      }
      else if (mode==='mirror') {
        const ne = findNearestEdge(pos.x,pos.y);
        if (ne) { saveState(); unfoldFigureInPlace(figures[ne.figureIndex],ne.edgeIndex); redrawAll(); }
      }
    }

    function handleDragMove(pos) {
      if (dragData.type==='figure') {
        const dx = pos.x-dragData.startX, dy = pos.y-dragData.startY;
        const f = figures[dragData.figureIndex];
        f.vertices.forEach(v => { v.x+=dx; v.y+=dy; });
        f.edges.forEach(e => { if (e.curved && e.controlX!=null) { e.controlX+=dx; e.controlY+=dy; } });
        dragData.startX=pos.x; dragData.startY=pos.y;
        redrawAll();
      }
      else if (dragData.type==='vertex') {
        let nx=pos.x, ny=pos.y;
        if (snapEnabled) { const s=applySnap(pos.x,pos.y,dragData.figureIndex,dragData.vertexIndex); nx=s.x; ny=s.y; }
        figures[dragData.figureIndex].vertices[dragData.vertexIndex].x = nx;
        figures[dragData.figureIndex].vertices[dragData.vertexIndex].y = ny;
        document.getElementById('vertexX').value = Math.round(nx);
        document.getElementById('vertexY').value = Math.round(ny);
        redrawWithGuides(pos.x, pos.y, dragData.figureIndex, dragData.vertexIndex);
      }
      else if (dragData.type==='curve') {
        const ed = figures[dragData.figureIndex].edges[dragData.edgeIndex];
        ed.controlX=pos.x; ed.controlY=pos.y;
        redrawAll();
      }
    }

    // ---- Apply functions ----
    function applyResize() {
      if (!selectedEdge) { alert('Primero selecciona una línea tocándola'); return; }
      const newLength = parseFloat(document.getElementById('resizeValue').value);
      if (isNaN(newLength) || newLength<=0) { alert('Valor inválido'); return; }
      saveState();
      resizeEdge(selectedEdge.figureIndex,selectedEdge.edgeIndex,newLength,selectedEdge.clickX,selectedEdge.clickY);
      document.getElementById('resizeValue').value='';
      document.getElementById('resizeIndicator').textContent='';
      selectedEdge=null;
      redrawAll();
    }

    function applyVertexCoordinates() {
      if (!selectedVertex) { alert('Primero selecciona un vértice tocándolo'); return; }
      const x=parseFloat(document.getElementById('vertexX').value);
      const y=parseFloat(document.getElementById('vertexY').value);
      if (isNaN(x)||isNaN(y)) { alert('Valores inválidos'); return; }
      saveState();
      figures[selectedVertex.figureIndex].vertices[selectedVertex.vertexIndex].x=x;
      figures[selectedVertex.figureIndex].vertices[selectedVertex.vertexIndex].y=y;
      redrawAll();
      document.getElementById('vertexX').value='';
      document.getElementById('vertexY').value='';
      selectedVertex=null;
    }

    // ---- Export JSON (fixed) ----
    function exportJSON() {
      const jsonData = JSON.stringify(figures, null, 2);
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;';
      const content = document.createElement('div');
      content.style.cssText = 'background:white;padding:20px;border-radius:8px;max-width:90%;max-height:80%;overflow:auto;';
      const h3 = document.createElement('h3'); h3.textContent = 'Datos JSON de las figuras';
      const ta = document.createElement('textarea');
      ta.readOnly=true; ta.style.cssText='width:100%;height:200px;font-family:monospace;'; ta.value=jsonData;
      const btnDiv = document.createElement('div'); btnDiv.style.marginTop='10px';
      const btnCopy = document.createElement('button'); btnCopy.textContent='Copiar al portapapeles';
      btnCopy.onclick = () => navigator.clipboard.writeText(jsonData).then(() => alert('JSON copiado'));
      const btnDl = document.createElement('button'); btnDl.textContent='Descargar archivo';
      btnDl.onclick = () => {
        const blob = new Blob([jsonData],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download='figuras.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      };
      const btnClose = document.createElement('button'); btnClose.textContent='Cerrar';
      btnClose.onclick = () => document.body.removeChild(modal);
      btnDiv.append(btnCopy, btnDl, btnClose);
      content.append(h3, ta, btnDiv);
      modal.appendChild(content);
      document.body.appendChild(modal);
    }

    // ---- Import JSON ----
    function importJSON() {
      const input = document.createElement('input'); input.type='file'; input.accept='.json';
      input.onchange = e => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data)) { alert('El archivo debe contener un array de figuras'); return; }
            const valid = data.every(f => f.vertices && Array.isArray(f.vertices) && f.edges && Array.isArray(f.edges));
            if (!valid) { alert('Formato incorrecto'); return; }
            saveState(); figures=data; redrawAll(); alert('Importado correctamente');
          } catch(err) { alert('Error: '+err.message); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ---- Keyboard ----
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key==='z' && !e.shiftKey) { e.preventDefault(); undoAction(); }
    });
  </script>
</body>
