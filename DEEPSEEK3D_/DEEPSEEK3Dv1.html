// ------------- SISTEMA DE TELA (basado en partículas) -------------
class Particle {
  constructor(x, y, z) {
    this.pos = new THREE.Vector3(x, y, z);
    this.old = new THREE.Vector3(x, y, z);
    this.pinned = false;
    this.mass = 1;
  }
}

class Cloth {
  constructor(particles, indices) {
    this.particles = particles;
    this.indices = indices;
    this.constraints = [];
    // Crear restricciones de distancia para cada arista
    const edgeSet = new Set();
    for (let i = 0; i < indices.length; i += 3) {
      const a = indices[i], b = indices[i+1], c = indices[i+2];
      this.addEdgeConstraint(a, b, edgeSet);
      this.addEdgeConstraint(b, c, edgeSet);
      this.addEdgeConstraint(c, a, edgeSet);
    }
    // Crear geometría Three.js que se actualiza
    this.geometry = new THREE.BufferGeometry();
    this.updateGeometry();
    this.mesh = new THREE.Mesh(this.geometry, new THREE.MeshPhongMaterial({
      color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8
    }));
    this.mesh.castShadow = false;
    this.mesh.receiveShadow = false;
  }

  addEdgeConstraint(i, j, set) {
    const key = i < j ? `${i}-${j}` : `${j}-${i}`;
    if (set.has(key)) return;
    set.add(key);
    const p1 = this.particles[i], p2 = this.particles[j];
    const dist = p1.pos.distanceTo(p2.pos);
    this.constraints.push({ i, j, restLength: dist });
  }

  updateGeometry() {
    const positions = [];
    for (const p of this.particles) {
      positions.push(p.pos.x, p.pos.y, p.pos.z);
    }
    this.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    this.geometry.setIndex(this.indices);
    this.geometry.computeVertexNormals();
  }

  simulate(dt, gravity) {
    const damp = 0.98; // amortiguación
    for (const p of this.particles) {
      if (p.pinned) continue;
      const vx = (p.pos.x - p.old.x) * damp;
      const vy = (p.pos.y - p.old.y) * damp;
      const vz = (p.pos.z - p.old.z) * damp;
      p.old.set(p.pos.x, p.pos.y, p.pos.z);
      p.pos.x += vx + gravity.x * dt;
      p.pos.y += vy + gravity.y * dt;
      p.pos.z += vz + gravity.z * dt;
    }
    // Resolver restricciones (varias iteraciones)
    for (let iter = 0; iter < 5; iter++) {
      for (const c of this.constraints) {
        const p1 = this.particles[c.i], p2 = this.particles[c.j];
        const dx = p2.pos.x - p1.pos.x;
        const dy = p2.pos.y - p1.pos.y;
        const dz = p2.pos.z - p1.pos.z;
        const dist = Math.sqrt(dx*dx+dy*dy+dz*dz) || 1;
        const diff = (dist - c.restLength) / dist;
        const moveX = dx * 0.5 * diff;
        const moveY = dy * 0.5 * diff;
        const moveZ = dz * 0.5 * diff;
        if (!p1.pinned) { p1.pos.x += moveX; p1.pos.y += moveY; p1.pos.z += moveZ; }
        if (!p2.pinned) { p2.pos.x -= moveX; p2.pos.y -= moveY; p2.pos.z -= moveZ; }
      }
    }
    // Colisión simple con esfera (maniquí)
    const sphereCenter = new THREE.Vector3(0, 10, 0);
    const sphereRadius = 15 + 1; // margen
    for (const p of this.particles) {
      if (p.pinned) continue;
      const toCenter = p.pos.clone().sub(sphereCenter);
      const dist = toCenter.length();
      if (dist < sphereRadius) {
        p.pos.copy(sphereCenter.clone().add(toCenter.normalize().multiplyScalar(sphereRadius)));
      }
    }

    // Colisión con el piso (y = -30)
    for (const p of this.particles) {
      if (p.pinned) continue;
      if (p.pos.y < -30) {
        p.pos.y = -30;
      }
    }

    

    this.updateGeometry();
  }
}

// ========== PROCESAR TODAS LAS FIGURAS CERRADAS ==========
const allFigures = jsonData.figures.filter(f => f.closed && f.vertices && f.vertices.length > 2);
if (allFigures.length === 0) throw new Error("No hay figuras cerradas");

const cloths = [];

allFigures.forEach(fig => {
  const points2D = fig.vertices.map(v => new THREE.Vector2(v.xCm, v.yCm));

  // Crear Shape con coordenadas originales (sin centrar)
  const shape = new THREE.Shape();
  shape.moveTo(points2D[0].x, points2D[0].y);
  for (let i = 1; i < points2D.length; i++) shape.lineTo(points2D[i].x, points2D[i].y);
  shape.closePath();

  const shapeGeo = new THREE.ShapeGeometry(shape);
  const posAttr = shapeGeo.attributes.position;
  const idxAttr = shapeGeo.index;

  const allVertices = [];
  for (let i = 0; i < posAttr.count; i++) {
    allVertices.push(new THREE.Vector3().fromBufferAttribute(posAttr, i));
  }

  let indices;
  if (idxAttr) {
    indices = Array.from(idxAttr.array);
  } else {
    indices = [];
    for (let i = 0; i < allVertices.length; i += 3) indices.push(i, i+1, i+2);
  }

  // Mapear: X original → X, Y original → Z, altura inicial = 40
  const startHeight = 40;
  const particles = allVertices.map(v => new Particle(v.x, startHeight, v.y));
  particles.forEach(p => p.old.copy(p.pos));

  const cloth = new Cloth(particles, indices);
  cloth.mesh.material = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.8
  });
  scene.add(cloth.mesh);
  cloths.push(cloth);
});

// ========== ANIMACIÓN (con gravedad más suave) ==========
const gravity = new THREE.Vector3(0, -150, 0); // cm/s² (antes -500, demasiado rápido)
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  for (const cloth of cloths) {
    cloth.simulate(dt, gravity);
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
