<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>Dibujo Geométrico</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 4px; overflow: auto; font-size: 14px; }
    #canvas { border: 1px solid black; display: block; touch-action: none; }
    button {
      padding: 3px 5px;
      margin: 2px 1px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #999;
      background: #eee;
      border-radius: 3px;
      line-height: 1;
    }
    button.on { background: #4caf50; color: white; border-color: #388e3c; }
    #joinApplyBtn { display: none; }
    #grainIndicator { font-size: 14px; margin-left: 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 3px; align-items: center; }
    input[type=number] { width: 52px; padding: 2px; font-size: 13px; }
    #vertexInputs, #resizeInputs { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
    #resizeIndicator { font-style: italic; color: #c0392b; font-size: 12px; }
    span.lbl { font-size: 12px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="createBtn"     onclick="toggleCreate()">✏️</button>
    <input type="number" id="sidesInput" min="3" max="10" value="3" title="Lados">
    <button id="moveBtn"       onclick="toggleMove()"      title="Mover">✋</button>
    <button id="vertexBtn"     onclick="toggleVertex()"    title="Vértice">◎</button>
    <button id="snapBtn"       onclick="toggleSnap()"      title="Snap">🧲</button>
    <button id="addVertexBtn"  onclick="toggleAddVertex()" title="Agregar vértice">➕</button>
    <button id="curveBtn"      onclick="toggleCurve()"     title="Curvar">〜</button>
    <button id="straightenBtn" onclick="toggleStraighten()" title="Curva→Recta">📐</button>
    <button id="mirrorBtn"     onclick="toggleMirror()"    title="Desdoblar">⟺</button>
    <button id="joinCurvesBtn" onclick="toggleJoinCurves()" title="Unir curvas">⛓</button>
    <button id="joinApplyBtn"  onclick="applyJoinCurves()" title="Aplicar unión">✔</button>
    <button id="resizeBtn"     onclick="toggleResize()"    title="Cambiar longitud">📏</button>
    <button id="rotateBtn"     onclick="toggleRotate()"    title="Rotar">🔄</button>
    <input type="number" id="rotateInput" value="90" step="1" title="Grados">
    <button id="duplicateBtn"  onclick="toggleDuplicate()" title="Duplicar">⧉</button>
    <button id="reflectBtn"    onclick="toggleReflect()"   title="Reflejar">↔</button>
    <button id="grainBtn"      onclick="toggleGrain()"     title="Hilo">🧵</button>
    <span id="grainIndicator">→</span>
    <button id="deleteBtn"     onclick="toggleDelete()"    title="Eliminar">🗑</button>
    <button onclick="clearAll()"    title="Eliminar todo">✖</button>
    <button onclick="undoAction()"  title="Deshacer">↩</button>
    <button onclick="exportJSON()"  title="Exportar JSON">💾</button>
    <button onclick="importJSON()"  title="Importar JSON">📂</button>
  </div>

  <div id="vertexInputs" hidden>
    <span class="lbl">X:</span><input type="number" id="vertexX">
    <span class="lbl">Y:</span><input type="number" id="vertexY">
    <button onclick="applyVertexCoordinates()" title="Aplicar">✔</button>
  </div>
  <div id="resizeInputs" hidden>
    <span class="lbl">px:</span>
    <input type="number" id="resizeValue" min="1">
    <button onclick="applyResize()" title="Aplicar">✔</button>
    <span id="resizeIndicator"></span>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let figures = [];
    let figuresHistory = [];
    let mode = 'none';
    let dragData = null;
    let selectedVertex = null;
    let selectedEdge = null;
    let touchStartPositions = [];
    let isTouchDevice = false;
    let snapEnabled = false;
    const SNAP_THRESHOLD = 10;
    let joinSelection = [];
    let grainDirection = 'horizontal';

    function resizeCanvas() {
      canvas.width  = Math.max(1200, window.innerWidth  - 16);
      canvas.height = Math.max(1200, window.innerHeight - 120);
      redrawAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function saveState() {
      figuresHistory.push(JSON.parse(JSON.stringify(figures)));
      if (figuresHistory.length > 20) figuresHistory.shift();
    }
    function undoAction() {
      if (figuresHistory.length > 0) { figures = figuresHistory.pop(); redrawAll(); }
      else alert('No hay acciones para deshacer');
    }
    function clearAll() {
      if (confirm('¿Eliminar todas las figuras?')) { saveState(); figures = []; redrawAll(); }
    }

    function toggleGrain() {
      grainDirection = grainDirection === 'horizontal' ? 'vertical' : 'horizontal';
      document.getElementById('grainIndicator').textContent = grainDirection === 'horizontal' ? '→' : '↓';
    }

    function toggleCreate()     { setMode('create',     '✏️'); }
    function toggleMove()       { setMode('move',       '✋'); }
    function toggleCurve()      { setMode('curve',      '〜'); }
    function toggleStraighten() { setMode('straighten', '📐'); }
    function toggleDelete()     { setMode('delete',     '🗑'); }
    function toggleMirror()     { setMode('mirror',     '⟺'); }
    function toggleAddVertex()  { setMode('addVertex',  '➕'); }
    function toggleResize()     { setMode('resize',     '📏'); }
    function toggleRotate()     { setMode('rotate',     '🔄'); }
    function toggleDuplicate()  { setMode('duplicate',  '⧉'); }
    function toggleReflect()    { setMode('reflect',    '↔'); }

    function toggleVertex() {
      const btn = document.getElementById('vertexBtn');
      const inputs = document.getElementById('vertexInputs');
      if (mode === 'vertex') {
        mode = 'none'; btn.classList.remove('on');
        inputs.hidden = true; selectedVertex = null; redrawAll();
      } else {
        mode = 'vertex'; btn.classList.add('on');
        inputs.hidden = false; resetOtherButtons('vertexBtn'); redrawAll();
      }
    }

    function toggleSnap() {
      snapEnabled = !snapEnabled;
      document.getElementById('snapBtn').classList.toggle('on', snapEnabled);
    }

    function toggleJoinCurves() {
      const btn = document.getElementById('joinCurvesBtn');
      const applyBtn = document.getElementById('joinApplyBtn');
      if (mode === 'joinCurves') {
        mode = 'none'; btn.classList.remove('on');
        applyBtn.style.display = 'none';
        joinSelection = []; redrawAll();
      } else {
        mode = 'joinCurves'; btn.classList.add('on');
        applyBtn.style.display = 'inline-block';
        joinSelection = []; resetOtherButtons('joinCurvesBtn'); redrawAll();
      }
    }

    function setMode(newMode, label) {
      const btn = document.getElementById(newMode + 'Btn');
      if (mode === newMode) {
        mode = 'none'; btn.classList.remove('on');
        if (newMode === 'resize') {
          document.getElementById('resizeInputs').hidden = true;
          document.getElementById('resizeIndicator').textContent = '';
          selectedEdge = null;
        }
      } else {
        mode = newMode; btn.classList.add('on');
        if (newMode === 'resize') document.getElementById('resizeInputs').hidden = false;
        resetOtherButtons(newMode + 'Btn');
      }
      redrawAll();
    }

    function resetOtherButtons(activeBtn) {
      const defs = [
        { id:'createBtn' },
        { id:'moveBtn' },
        { id:'vertexBtn', extra: () => { document.getElementById('vertexInputs').hidden = true; selectedVertex = null; } },
        { id:'addVertexBtn' },
        { id:'curveBtn' },
        { id:'straightenBtn' },
        { id:'deleteBtn' },
        { id:'mirrorBtn' },
        { id:'resizeBtn', extra: () => {
            document.getElementById('resizeInputs').hidden = true;
            document.getElementById('resizeIndicator').textContent = '';
            selectedEdge = null;
          }
        },
        { id:'rotateBtn' },
        { id:'duplicateBtn' },
        { id:'reflectBtn' },
        { id:'joinCurvesBtn', extra: () => {
            document.getElementById('joinApplyBtn').style.display = 'none';
            joinSelection = [];
          }
        },
      ];
      defs.forEach(d => {
        if (d.id !== activeBtn) {
          document.getElementById(d.id).classList.remove('on');
          if (d.extra) d.extra();
        }
      });
    }

    function applySnap(x, y, excludeFi, excludeVi) {
      let sx = x, sy = y, foundX = false, foundY = false;
      for (let fi = 0; fi < figures.length && !(foundX && foundY); fi++) {
        for (let vi = 0; vi < figures[fi].vertices.length && !(foundX && foundY); vi++) {
          if (fi === excludeFi && vi === excludeVi) continue;
          const v = figures[fi].vertices[vi];
          if (!foundY && Math.abs(y - v.y) < SNAP_THRESHOLD) { sy = v.y; foundY = true; }
          if (!foundX && Math.abs(x - v.x) < SNAP_THRESHOLD) { sx = v.x; foundX = true; }
        }
      }
      return { x: sx, y: sy };
    }

    function drawSnapGuides(x, y, excludeFi, excludeVi) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,120,255,0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      for (let fi = 0; fi < figures.length; fi++) {
        for (let vi = 0; vi < figures[fi].vertices.length; vi++) {
          if (fi === excludeFi && vi === excludeVi) continue;
          const v = figures[fi].vertices[vi];
          if (Math.abs(y - v.y) < SNAP_THRESHOLD) {
            ctx.beginPath(); ctx.moveTo(0, v.y); ctx.lineTo(canvas.width, v.y); ctx.stroke();
          }
          if (Math.abs(x - v.x) < SNAP_THRESHOLD) {
            ctx.beginPath(); ctx.moveTo(v.x, 0); ctx.lineTo(v.x, canvas.height); ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    // Cuadrática → cúbica exacta
    function q2c(p0, c, p1) {
      return {
        cp1: { x: p0.x + 2/3*(c.x - p0.x), y: p0.y + 2/3*(c.y - p0.y) },
        cp2: { x: p1.x + 2/3*(c.x - p1.x), y: p1.y + 2/3*(c.y - p1.y) }
      };
    }

    function makeEdge(start, end) {
      return { start, end, curved: false, cubic: false,
               controlX: null, controlY: null, control2X: null, control2Y: null };
    }

    function createPolygon(cx, cy, sides, radius = 50) {
      const vertices = [], edges = [];
      for (let i = 0; i < sides; i++) {
        const ang = (i * 2 * Math.PI) / sides - Math.PI / 2;
        vertices.push({ x: cx + radius * Math.cos(ang), y: cy + radius * Math.sin(ang) });
      }
      for (let i = 0; i < sides; i++) edges.push(makeEdge(i, (i+1) % sides));
      return { vertices, edges };
    }

    function getEventPos(e) {
      const r = canvas.getBoundingClientRect();
      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
      return { x: clientX - r.left, y: clientY - r.top };
    }

    function isPointInPolygon(x, y, figure) {
      const v = figure.vertices; let inside = false;
      for (let i = 0, j = v.length - 1; i < v.length; j = i++)
        if (((v[i].y > y) !== (v[j].y > y)) &&
            (x < (v[j].x - v[i].x) * (y - v[i].y) / (v[j].y - v[i].y) + v[i].x))
          inside = !inside;
      return inside;
    }

    function findClickedFigure(x, y) {
      for (let i = figures.length - 1; i >= 0; i--)
        if (isPointInPolygon(x, y, figures[i])) return i;
      return -1;
    }

    function findNearestVertex(x, y, thr = 20) {
      for (let fi = 0; fi < figures.length; fi++)
        for (let vi = 0; vi < figures[fi].vertices.length; vi++) {
          const p = figures[fi].vertices[vi];
          if (Math.hypot(x - p.x, y - p.y) < thr) return { figureIndex: fi, vertexIndex: vi };
        }
      return null;
    }

    function distanceToLine(px, py, x1, y1, x2, y2) {
      const A=px-x1, B=py-y1, C=x2-x1, D=y2-y1;
      const dot=A*C+B*D, len=C*C+D*D;
      if (!len) return Math.hypot(A, B);
      let t=dot/len;
      if (t<0) return Math.hypot(A, B);
      if (t>1) return Math.hypot(px-x2, py-y2);
      return Math.hypot(px-(x1+t*C), py-(y1+t*D));
    }

    function distanceToQuad(px, py, x1, y1, cx, cy, x2, y2) {
      let d = Infinity;
      for (let t=0; t<=1; t+=0.05) {
        const xt=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2;
        const yt=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;
        d = Math.min(d, Math.hypot(px-xt, py-yt));
      }
      return d;
    }

    function distanceToCubic(px, py, x0, y0, cx1, cy1, cx2, cy2, x1, y1) {
      let d = Infinity;
      for (let t=0; t<=1; t+=0.05) {
        const mt=1-t;
        const xt=mt*mt*mt*x0+3*mt*mt*t*cx1+3*mt*t*t*cx2+t*t*t*x1;
        const yt=mt*mt*mt*y0+3*mt*mt*t*cy1+3*mt*t*t*cy2+t*t*t*y1;
        d = Math.min(d, Math.hypot(px-xt, py-yt));
      }
      return d;
    }

    function edgeDistance(x, y, fig, e) {
      const a = fig.vertices[e.start], b = fig.vertices[e.end];
      if (e.cubic && e.control2X != null)
        return distanceToCubic(x,y,a.x,a.y,e.controlX,e.controlY,e.control2X,e.control2Y,b.x,b.y);
      if (e.curved && e.controlX != null)
        return distanceToQuad(x,y,a.x,a.y,e.controlX,e.controlY,b.x,b.y);
      return distanceToLine(x,y,a.x,a.y,b.x,b.y);
    }

    function findNearestEdge(x, y, thr = 15) {
      for (let fi = 0; fi < figures.length; fi++) {
        const f = figures[fi];
        for (let ei = 0; ei < f.edges.length; ei++)
          if (edgeDistance(x, y, f, f.edges[ei]) < thr) return { figureIndex: fi, edgeIndex: ei };
      }
      return null;
    }

    function getClosestPointOnLine(px, py, x1, y1, x2, y2) {
      const A=px-x1, B=py-y1, C=x2-x1, D=y2-y1;
      const dot=A*C+B*D, len=C*C+D*D;
      if (!len) return { x:x1, y:y1, t:0 };
      let t = Math.max(0, Math.min(1, dot/len));
      return { x:x1+t*C, y:y1+t*D, t };
    }

    function getClosestPointOnCurve(px, py, x1, y1, cx, cy, x2, y2) {
      let best=Infinity, bestPt={x:x1,y:y1,t:0};
      for (let t=0; t<=1; t+=0.01) {
        const xt=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2;
        const yt=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;
        const d=Math.hypot(px-xt,py-yt);
        if (d<best) { best=d; bestPt={x:xt,y:yt,t}; }
      }
      return bestPt;
    }

    function getCentroid(figure) {
      let cx=0, cy=0;
      figure.vertices.forEach(v => { cx+=v.x; cy+=v.y; });
      return { x: cx/figure.vertices.length, y: cy/figure.vertices.length };
    }

    function addVertexOnEdge(figureIndex, edgeIndex, x, y) {
      const figure = figures[figureIndex];
      const edge   = figure.edges[edgeIndex];
      const a = figure.vertices[edge.start], b = figure.vertices[edge.end];
      let newPoint, t;
      if (edge.curved && edge.controlX != null) {
        const c = getClosestPointOnCurve(x,y,a.x,a.y,edge.controlX,edge.controlY,b.x,b.y);
        newPoint = {x:c.x,y:c.y}; t = c.t;
      } else {
        const c = getClosestPointOnLine(x,y,a.x,a.y,b.x,b.y);
        newPoint = {x:c.x,y:c.y}; t = c.t;
      }
      const nvi = edge.end;
      figure.vertices.splice(nvi, 0, newPoint);
      figure.edges.forEach(e => { if (e.start>=nvi) e.start++; if (e.end>=nvi) e.end++; });
      if (edge.curved && edge.controlX != null) {
        const c1x=(1-t)*a.x+t*edge.controlX, c1y=(1-t)*a.y+t*edge.controlY;
        const c2x=(1-t)*edge.controlX+t*b.x,  c2y=(1-t)*edge.controlY+t*b.y;
        edge.end=nvi; edge.controlX=c1x; edge.controlY=c1y;
        figure.edges.splice(edgeIndex+1, 0,
          { start:nvi, end:nvi+1, curved:true, cubic:false, controlX:c2x, controlY:c2y, control2X:null, control2Y:null });
      } else {
        edge.end=nvi;
        figure.edges.splice(edgeIndex+1, 0, makeEdge(nvi, nvi+1));
      }
    }

    function resizeEdge(figureIndex, edgeIndex, newLength, clickX, clickY) {
      const figure = figures[figureIndex];
      const edge   = figure.edges[edgeIndex];
      const a = figure.vertices[edge.start], b = figure.vertices[edge.end];
      const currentLength = Math.hypot(b.x-a.x, b.y-a.y);
      if (currentLength === 0) return;
      const moveB = Math.hypot(clickX-b.x,clickY-b.y) < Math.hypot(clickX-a.x,clickY-a.y);
      const sf = newLength / currentLength;
      if (moveB) {
        const dx=b.x-a.x, dy=b.y-a.y;
        b.x=a.x+dx*sf; b.y=a.y+dy*sf;
        if (edge.controlX  != null) { edge.controlX =a.x+(edge.controlX -a.x)*sf; edge.controlY =a.y+(edge.controlY -a.y)*sf; }
        if (edge.control2X != null) { edge.control2X=a.x+(edge.control2X-a.x)*sf; edge.control2Y=a.y+(edge.control2Y-a.y)*sf; }
      } else {
        const dx=a.x-b.x, dy=a.y-b.y;
        a.x=b.x+dx*sf; a.y=b.y+dy*sf;
        if (edge.controlX  != null) { edge.controlX =b.x+(edge.controlX -b.x)*sf; edge.controlY =b.y+(edge.controlY -b.y)*sf; }
        if (edge.control2X != null) { edge.control2X=b.x+(edge.control2X-b.x)*sf; edge.control2Y=b.y+(edge.control2Y-b.y)*sf; }
      }
    }

    function rotateFigure(fi, degrees) {
      const f=figures[fi], c=getCentroid(f);
      const rad=degrees*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
      function rot(x,y) { const dx=x-c.x,dy=y-c.y; return {x:c.x+dx*cos-dy*sin, y:c.y+dx*sin+dy*cos}; }
      f.vertices.forEach(v => { const r=rot(v.x,v.y); v.x=r.x; v.y=r.y; });
      f.edges.forEach(e => {
        if (e.controlX  != null) { const r=rot(e.controlX,e.controlY);   e.controlX=r.x;  e.controlY=r.y; }
        if (e.control2X != null) { const r=rot(e.control2X,e.control2Y); e.control2X=r.x; e.control2Y=r.y; }
      });
    }

    function duplicateFigure(fi, ox=100, oy=100) {
      const o=figures[fi];
      figures.push({
        vertices: o.vertices.map(v => ({x:v.x+ox, y:v.y+oy})),
        edges: o.edges.map(e => ({
          start:e.start, end:e.end, curved:e.curved, cubic:e.cubic||false,
          controlX:  e.controlX  != null ? e.controlX +ox : null,
          controlY:  e.controlY  != null ? e.controlY +oy : null,
          control2X: e.control2X != null ? e.control2X+ox : null,
          control2Y: e.control2Y != null ? e.control2Y+oy : null,
        }))
      });
    }

    function reflectFigure(fi, ox=100, oy=0) {
      const o=figures[fi], c=getCentroid(o);
      figures.push({
        vertices: o.vertices.map(v => ({x:2*c.x-v.x+ox, y:v.y+oy})),
        edges: o.edges.map(e => ({
          start:e.start, end:e.end, curved:e.curved, cubic:e.cubic||false,
          controlX:  e.controlX  != null ? 2*c.x-e.controlX +ox : null,
          controlY:  e.controlY  != null ? e.controlY +oy : null,
          control2X: e.control2X != null ? 2*c.x-e.control2X+ox : null,
          control2Y: e.control2Y != null ? e.control2Y+oy : null,
        }))
      });
    }

    function unfoldFigureInPlace(figure, hingeEdgeIndex) {
      const n=figure.vertices.length;
      if (n<3) return;
      const hinge=figure.edges[hingeEdgeIndex];
      const A=hinge.start, B=hinge.end;
      const prev=i=>(i-1+n)%n, next=i=>(i+1)%n;
      const seqOrig=[A]; let i=A;
      while(i!==B){i=prev(i);seqOrig.push(i);}
      const seqMirror=[]; let j=next(B);
      while(j!==A){seqMirror.push(j);j=next(j);}
      const P1=figure.vertices[A], P2=figure.vertices[B];
      function reflectXY(x,y){
        const dx=P2.x-P1.x,dy=P2.y-P1.y;
        const a=dy,b=-dx,c=dx*P1.y-dy*P1.x;
        const d=(a*x+b*y+c)/(a*a+b*b);
        return{x:x-2*a*d,y:y-2*b*d};
      }
      const nv=[];
      seqOrig.forEach(idx=>{const v=figure.vertices[idx];nv.push({x:v.x,y:v.y});});
      seqMirror.forEach(idx=>{const v=figure.vertices[idx];nv.push(reflectXY(v.x,v.y));});
      const ne=[];
      for(let t=0;t<seqOrig.length-1;t++){
        const e=figure.edges[seqOrig[t+1]];
        const rc=e.controlX!=null?e:null;
        const rc2=e.control2X!=null?reflectXY(e.control2X,e.control2Y):null;
        ne.push({start:t,end:t+1,curved:!!e.curved,cubic:!!e.cubic,
          controlX:rc?rc.controlX:null,controlY:rc?rc.controlY:null,
          control2X:rc2?rc2.x:null,control2Y:rc2?rc2.y:null});
      }
      for(let t=0;t<seqMirror.length;t++){
        const e=figure.edges[(B+t)%n];
        const si=(seqOrig.length-1)+t;
        const rc=e.controlX!=null?reflectXY(e.controlX,e.controlY):null;
        const rc2=e.control2X!=null?reflectXY(e.control2X,e.control2Y):null;
        ne.push({start:si,end:si+1,curved:!!e.curved,cubic:!!e.cubic,
          controlX:rc?rc.x:null,controlY:rc?rc.y:null,
          control2X:rc2?rc2.x:null,control2Y:rc2?rc2.y:null});
      }
      const eClose=figure.edges[(A-1+n)%n];
      const rc=eClose.controlX!=null?reflectXY(eClose.controlX,eClose.controlY):null;
      const rc2=eClose.control2X!=null?reflectXY(eClose.control2X,eClose.control2Y):null;
      ne.push({start:nv.length-1,end:0,curved:!!eClose.curved,cubic:!!eClose.cubic,
        controlX:rc?rc.x:null,controlY:rc?rc.y:null,
        control2X:rc2?rc2.x:null,control2Y:rc2?rc2.y:null});
      figure.vertices=nv; figure.edges=ne;
    }

    // Convierte una arista a sus puntos de control cúbicos exactos
    function edgeToCubicControls(figure, edge) {
      const a = figure.vertices[edge.start];
      const b = figure.vertices[edge.end];
      if (edge.cubic && edge.control2X != null) {
        return {
          cp1: { x: edge.controlX,  y: edge.controlY  },
          cp2: { x: edge.control2X, y: edge.control2Y }
        };
      } else if (edge.curved && edge.controlX != null) {
        return q2c(a, { x: edge.controlX, y: edge.controlY }, b);
      } else {
        return {
          cp1: { x: a.x + (b.x - a.x) / 3, y: a.y + (b.y - a.y) / 3 },
          cp2: { x: a.x + 2*(b.x - a.x) / 3, y: a.y + 2*(b.y - a.y) / 3 }
        };
      }
    }

    // Une N cúbicas consecutivas en una sola cúbica preservando tangentes en los extremos.
    // CP1 global = CP1 del primer segmento (tangente de salida en P0, sin escalar)
    // CP2 global = CP2 del último segmento (tangente de entrada en Pn, sin escalar)
    function joinCubics(cubics) {
      const P0 = cubics[0].P0;
      const Pn = cubics[cubics.length - 1].P3;
      const CP1 = cubics[0].CP1;
      const CP2 = cubics[cubics.length - 1].CP2;
      return { P0, CP1, CP2, Pn };
    }

    function applyJoinCurves() {
      if (joinSelection.length < 2) { alert('Selecciona al menos 2 curvas'); return; }

      const byFigure = {};
      joinSelection.forEach(s => {
        if (!byFigure[s.figureIndex]) byFigure[s.figureIndex] = [];
        byFigure[s.figureIndex].push(s.edgeIndex);
      });

      saveState();

      Object.keys(byFigure).forEach(fiStr => {
        const fi = parseInt(fiStr);
        const figure = figures[fi];
        const edgeIndices = byFigure[fi].sort((a,b) => a-b);

        for (let k = 1; k < edgeIndices.length; k++) {
          if (edgeIndices[k] !== edgeIndices[k-1]+1) {
            alert('Las curvas deben ser consecutivas'); return;
          }
        }

        // Convertir cada arista a cúbica
        const cubics = edgeIndices.map(ei => {
          const edge = figure.edges[ei];
          const a = figure.vertices[edge.start];
          const b = figure.vertices[edge.end];
          const ctrls = edgeToCubicControls(figure, edge);
          return { P0: a, CP1: ctrls.cp1, CP2: ctrls.cp2, P3: b };
        });

        // Obtener puntos de control de la cúbica unida
        const joined = joinCubics(cubics);

        const firstE = figure.edges[edgeIndices[0]];
        const lastE  = figure.edges[edgeIndices[edgeIndices.length - 1]];
        const endVIdx = lastE.end;

        // Recopilar vértices intermedios a eliminar
        const intermediateVerts = [];
        for (let k = 0; k < edgeIndices.length - 1; k++)
          intermediateVerts.push(figure.edges[edgeIndices[k]].end);

        // Eliminar aristas extra (de atrás hacia adelante)
        for (let k = edgeIndices.length - 1; k >= 1; k--)
          figure.edges.splice(edgeIndices[k], 1);

        // Calcular el índice final corregido ANTES de eliminar vértices
        let correctedEnd = endVIdx;
        intermediateVerts.sort((a, b) => b - a);
        intermediateVerts.forEach(vi => {
          if (vi < correctedEnd) correctedEnd--;
        });

        // Eliminar vértices intermedios y corregir todos los índices
        intermediateVerts.forEach(vi => {
          figure.vertices.splice(vi, 1);
          figure.edges.forEach(e => {
            if (e.start > vi) e.start--;
            if (e.end   > vi) e.end--;
          });
        });

        // Actualizar primera arista con índice final ya corregido
        firstE.end       = correctedEnd;
        firstE.curved    = true;
        firstE.cubic     = true;
        firstE.controlX  = joined.CP1.x;
        firstE.controlY  = joined.CP1.y;
        firstE.control2X = joined.CP2.x;
        firstE.control2Y = joined.CP2.y;
      });

      joinSelection = [];
      redrawAll();
    }

    // ---- Draw ----
    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      figures.forEach((fig, fi) => drawFigure(fig, fi));
      if (mode === 'resize' && selectedEdge) drawResizeIndicator();
      if (mode === 'addVertex') drawAllVertices();
    }

    function redrawWithGuides(x, y, figureIndex, vertexIndex) {
      redrawAll();
      if (snapEnabled) drawSnapGuides(x, y, figureIndex, vertexIndex);
    }

    function drawFigure(figure, fi) {
      figure.edges.forEach((e, ei) => {
        const a = figure.vertices[e.start], b = figure.vertices[e.end];
        const isSelected = mode === 'joinCurves' &&
          joinSelection.some(s => s.figureIndex===fi && s.edgeIndex===ei);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        if (e.cubic && e.control2X != null) {
          ctx.bezierCurveTo(e.controlX, e.controlY, e.control2X, e.control2Y, b.x, b.y);
        } else if (e.curved && e.controlX != null) {
          ctx.quadraticCurveTo(e.controlX, e.controlY, b.x, b.y);
        } else {
          ctx.lineTo(b.x, b.y);
        }
        ctx.strokeStyle = isSelected ? '#e74c3c' : '#000';
        ctx.lineWidth   = isSelected ? 3 : 2;
        ctx.stroke();
      });
    }

    function drawAllVertices() {
      figures.forEach(fig => {
        fig.vertices.forEach(v => {
          ctx.beginPath();
          ctx.arc(v.x, v.y, 6, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(52,152,219,0.5)';
          ctx.fill();
          ctx.strokeStyle = '#2980b9';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      });
    }

    function drawResizeIndicator() {
      if (!selectedEdge) return;
      const fig  = figures[selectedEdge.figureIndex];
      const edge = fig.edges[selectedEdge.edgeIndex];
      const a = fig.vertices[edge.start], b = fig.vertices[edge.end];
      const moveB = Math.hypot(selectedEdge.clickX-b.x,selectedEdge.clickY-b.y) <
                    Math.hypot(selectedEdge.clickX-a.x,selectedEdge.clickY-a.y);
      const movingPt = moveB ? b : a, fixedPt = moveB ? a : b;
      ctx.beginPath(); ctx.arc(fixedPt.x,  fixedPt.y,  6, 0, Math.PI*2); ctx.fillStyle='#27ae60'; ctx.fill();
      ctx.beginPath(); ctx.arc(movingPt.x, movingPt.y, 6, 0, Math.PI*2); ctx.fillStyle='#e74c3c'; ctx.fill();
      document.getElementById('resizeIndicator').textContent =
        '← extremo ' + (moveB ? 'B' : 'A') + ' (rojo)';
    }

    // ---- Events ----
    canvas.addEventListener('touchstart', e => { isTouchDevice=true; handleTouchStart(e); }, {passive:false});
    canvas.addEventListener('touchmove',  handleTouchMove, {passive:false});
    canvas.addEventListener('touchend',   handleTouchEnd,  {passive:true});
    canvas.addEventListener('mousedown', e => { if(!isTouchDevice) handleStart(e); });
    canvas.addEventListener('mousemove', e => { if(!isTouchDevice) handleMove(e); });
    canvas.addEventListener('mouseup',   e => { if(!isTouchDevice) handleEnd(e); });

    function handleTouchStart(e) {
      if(e.touches.length===1) { e.preventDefault(); handleSingleTouch(getEventPos(e)); }
      else if(e.touches.length===2)
        touchStartPositions=Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY}));
    }
    function handleTouchMove(e) { if(e.touches.length===1&&dragData){ e.preventDefault(); handleDragMove(getEventPos(e)); } }
    function handleTouchEnd()   { dragData=null; touchStartPositions=[]; }
    function handleStart(e)     { e.preventDefault(); handleSingleTouch(getEventPos(e)); }
    function handleMove(e)      { e.preventDefault(); if(dragData) handleDragMove(getEventPos(e)); }
    function handleEnd(e)       { e.preventDefault(); dragData=null; }

    function handleSingleTouch(pos) {
      if (mode==='create') {
        const s=parseInt(document.getElementById('sidesInput').value);
        if(s>=3&&s<=10){saveState();figures.push(createPolygon(pos.x,pos.y,s));redrawAll();}
      }
      else if (mode==='move') {
        const fi=findClickedFigure(pos.x,pos.y);
        if(fi!==-1){saveState();dragData={type:'figure',figureIndex:fi,startX:pos.x,startY:pos.y};}
      }
      else if (mode==='vertex') {
        const nv=findNearestVertex(pos.x,pos.y);
        if(nv){
          saveState(); selectedVertex=nv;
          const v=figures[nv.figureIndex].vertices[nv.vertexIndex];
          document.getElementById('vertexX').value=Math.round(v.x);
          document.getElementById('vertexY').value=Math.round(v.y);
          dragData={type:'vertex',figureIndex:nv.figureIndex,vertexIndex:nv.vertexIndex};
        }
      }
      else if (mode==='addVertex') {
        const ne=findNearestEdge(pos.x,pos.y);
        if(ne){saveState();addVertexOnEdge(ne.figureIndex,ne.edgeIndex,pos.x,pos.y);redrawAll();}
      }
      else if (mode==='curve') {
        const ne=findNearestEdge(pos.x,pos.y);
        if(ne){
          saveState();
          const edge=figures[ne.figureIndex].edges[ne.edgeIndex];
          edge.curved=true; edge.cubic=false;
          edge.controlX=pos.x; edge.controlY=pos.y;
          edge.control2X=null; edge.control2Y=null;
          dragData={type:'curve',figureIndex:ne.figureIndex,edgeIndex:ne.edgeIndex};
          redrawAll();
        }
      }
      else if (mode==='straighten') {
        const ne=findNearestEdge(pos.x,pos.y);
        if(ne){
          const edge=figures[ne.figureIndex].edges[ne.edgeIndex];
          if(edge.curved){
            saveState();
            edge.curved=false; edge.cubic=false;
            edge.controlX=null; edge.controlY=null;
            edge.control2X=null; edge.control2Y=null;
            redrawAll();
          }
        }
      }
      else if (mode==='joinCurves') {
        const ne=findNearestEdge(pos.x,pos.y);
        if(ne){
          const edge=figures[ne.figureIndex].edges[ne.edgeIndex];
          if(!edge.curved) return;
          const idx=joinSelection.findIndex(s=>s.figureIndex===ne.figureIndex&&s.edgeIndex===ne.edgeIndex);
          if(idx>=0) joinSelection.splice(idx,1);
          else joinSelection.push({figureIndex:ne.figureIndex,edgeIndex:ne.edgeIndex});
          redrawAll();
        }
      }
      else if (mode==='resize') {
        const ne=findNearestEdge(pos.x,pos.y);
        if(ne){
          const fig=figures[ne.figureIndex];
          const edge=fig.edges[ne.edgeIndex];
          const a=fig.vertices[edge.start],b=fig.vertices[edge.end];
          selectedEdge={figureIndex:ne.figureIndex,edgeIndex:ne.edgeIndex,clickX:pos.x,clickY:pos.y};
          document.getElementById('resizeValue').value=Math.round(Math.hypot(b.x-a.x,b.y-a.y));
          redrawAll();
        }
      }
      else if (mode==='rotate') {
        const fi=findClickedFigure(pos.x,pos.y);
        if(fi!==-1){saveState();rotateFigure(fi,parseFloat(document.getElementById('rotateInput').value)||90);redrawAll();}
      }
      else if (mode==='duplicate') {
        const fi=findClickedFigure(pos.x,pos.y);
        if(fi!==-1){saveState();duplicateFigure(fi);redrawAll();}
      }
      else if (mode==='reflect') {
        const fi=findClickedFigure(pos.x,pos.y);
        if(fi!==-1){saveState();reflectFigure(fi);redrawAll();}
      }
      else if (mode==='delete') {
        const fi=findClickedFigure(pos.x,pos.y);
        if(fi!==-1){saveState();figures.splice(fi,1);redrawAll();}
      }
      else if (mode==='mirror') {
        const ne=findNearestEdge(pos.x,pos.y);
        if(ne){saveState();unfoldFigureInPlace(figures[ne.figureIndex],ne.edgeIndex);redrawAll();}
      }
    }

    function handleDragMove(pos) {
      if (dragData.type==='figure') {
        const dx=pos.x-dragData.startX, dy=pos.y-dragData.startY;
        const f=figures[dragData.figureIndex];
        f.vertices.forEach(v=>{v.x+=dx;v.y+=dy;});
        f.edges.forEach(e=>{
          if(e.controlX  != null){e.controlX +=dx;e.controlY +=dy;}
          if(e.control2X != null){e.control2X+=dx;e.control2Y+=dy;}
        });
        dragData.startX=pos.x; dragData.startY=pos.y;
        redrawAll();
      }
      else if (dragData.type==='vertex') {
        let nx=pos.x, ny=pos.y;
        if(snapEnabled){const s=applySnap(pos.x,pos.y,dragData.figureIndex,dragData.vertexIndex);nx=s.x;ny=s.y;}
        figures[dragData.figureIndex].vertices[dragData.vertexIndex].x=nx;
        figures[dragData.figureIndex].vertices[dragData.vertexIndex].y=ny;
        document.getElementById('vertexX').value=Math.round(nx);
        document.getElementById('vertexY').value=Math.round(ny);
        redrawWithGuides(pos.x,pos.y,dragData.figureIndex,dragData.vertexIndex);
      }
      else if (dragData.type==='curve') {
        const ed=figures[dragData.figureIndex].edges[dragData.edgeIndex];
        ed.controlX=pos.x; ed.controlY=pos.y;
        redrawAll();
      }
    }

    function applyResize() {
      if(!selectedEdge){alert('Primero selecciona una línea');return;}
      const newLength=parseFloat(document.getElementById('resizeValue').value);
      if(isNaN(newLength)||newLength<=0){alert('Valor inválido');return;}
      saveState();
      resizeEdge(selectedEdge.figureIndex,selectedEdge.edgeIndex,newLength,selectedEdge.clickX,selectedEdge.clickY);
      document.getElementById('resizeValue').value='';
      document.getElementById('resizeIndicator').textContent='';
      selectedEdge=null; redrawAll();
    }

    function applyVertexCoordinates() {
      if(!selectedVertex){alert('Primero selecciona un vértice');return;}
      const x=parseFloat(document.getElementById('vertexX').value);
      const y=parseFloat(document.getElementById('vertexY').value);
      if(isNaN(x)||isNaN(y)){alert('Valores inválidos');return;}
      saveState();
      figures[selectedVertex.figureIndex].vertices[selectedVertex.vertexIndex].x=x;
      figures[selectedVertex.figureIndex].vertices[selectedVertex.vertexIndex].y=y;
      redrawAll();
      document.getElementById('vertexX').value='';
      document.getElementById('vertexY').value='';
      selectedVertex=null;
    }

    // ---- Export JSON ----
    function exportJSON() {
      const exportData = { grainDirection, figures };
      const jsonData = JSON.stringify(exportData, null, 2);

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';

      const box = document.createElement('div');
      box.style.cssText = 'background:#fff;padding:16px;border-radius:8px;width:92%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;gap:8px;';

      const title = document.createElement('div');
      title.textContent = 'Exportar JSON';
      title.style.cssText = 'font-weight:bold;font-size:15px;';

      const ta = document.createElement('textarea');
      ta.value = jsonData;
      ta.readOnly = true;
      ta.style.cssText = 'width:100%;flex:1;min-height:150px;font-family:monospace;font-size:11px;border:1px solid #ccc;padding:6px;resize:vertical;';

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';

      const btnCopy = document.createElement('button');
      btnCopy.textContent = '📋 Copiar';
      btnCopy.style.cssText = 'flex:1;padding:8px;font-size:14px;';
      btnCopy.onclick = () => {
        ta.select();
        try {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(jsonData).then(() => { btnCopy.textContent = '✔ Copiado'; setTimeout(() => { btnCopy.textContent = '📋 Copiar'; }, 1500); });
          } else {
            document.execCommand('copy');
            btnCopy.textContent = '✔ Copiado';
            setTimeout(() => { btnCopy.textContent = '📋 Copiar'; }, 1500);
          }
        } catch(e) { alert('Copia manualmente el texto'); }
      };

      const btnDl = document.createElement('button');
      btnDl.textContent = '💾 Descargar';
      btnDl.style.cssText = 'flex:1;padding:8px;font-size:14px;';
      btnDl.onclick = () => {
        try {
          const blob = new Blob([jsonData], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'figuras.json';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
        } catch(e) {
          const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonData);
          const a = document.createElement('a');
          a.href = dataUri;
          a.download = 'figuras.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      };

      const btnClose = document.createElement('button');
      btnClose.textContent = '✖ Cerrar';
      btnClose.style.cssText = 'flex:1;padding:8px;font-size:14px;';
      btnClose.onclick = () => document.body.removeChild(overlay);

      btnRow.append(btnCopy, btnDl, btnClose);
      box.append(title, ta, btnRow);
      overlay.appendChild(box);
      overlay.addEventListener('click', e => { if(e.target===overlay) document.body.removeChild(overlay); });
      document.body.appendChild(overlay);
      setTimeout(() => ta.select(), 100);
    }

    // ---- Import JSON ----
    function importJSON() {
      const input=document.createElement('input'); input.type='file'; input.accept='.json';
      input.onchange=e=>{
        const file=e.target.files[0]; if(!file) return;
        const reader=new FileReader();
        reader.onload=ev=>{
          try{
            const data=JSON.parse(ev.target.result);
            if(data.figures && Array.isArray(data.figures)){
              if(data.grainDirection) {
                grainDirection=data.grainDirection;
                document.getElementById('grainIndicator').textContent = grainDirection==='horizontal' ? '→' : '↓';
              }
              saveState(); figures=data.figures; redrawAll(); alert('Importado correctamente');
            }
            else if(Array.isArray(data)){
              const valid=data.every(f=>f.vertices&&Array.isArray(f.vertices)&&f.edges&&Array.isArray(f.edges));
              if(!valid){alert('Formato incorrecto');return;}
              saveState(); figures=data; redrawAll(); alert('Importado correctamente');
            }
            else { alert('Formato incorrecto'); }
          }catch(err){alert('Error: '+err.message);}
        };
        reader.readAsText(file);
      };
      input.click();
    }

    document.addEventListener('keydown', e=>{
      if(e.ctrlKey&&e.key==='z'&&!e.shiftKey){e.preventDefault();undoAction();}
    });
  </script>
