<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <button></button>
        <canvas id="canvas" style="border: 1px solid black; touch-action: none;"></canvas>
        <script>




            document.addEventListener("touchstart", e => {
                if (e.touches.length < 2) {
                    e.preventDefault();
                }
            }, {passive: false});

            document.addEventListener("touchmove", e => {
                if (e.touches.length < 2) {
                    e.preventDefault();
                }
            }, {passive: false});
        </script>
    </body>
</html>
